<title>vectorwake</title>
<style>
  :root {
    --bg: #05070c;
    --ink: #dfe9f5;
    --dim: #6c7a90;
    --friend: #4fd6ff;
    --enemy: #ffa552;
    --bomb: #ff5ea8;
    --grid: #16202f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  #wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .panel {
    position: absolute; padding: 10px 12px;
    background: rgba(5, 8, 14, .72); border: 1px solid #1d2838;
    letter-spacing: .02em;
  }
  #hud { left: 14px; bottom: 14px; min-width: 232px; }
  #hud .row { display: flex; justify-content: space-between; gap: 14px; }
  #bar { height: 6px; background: #121a26; margin-top: 7px; border: 1px solid #22304a; }
  #barfill { height: 100%; background: var(--friend); width: 100%; }
  #radarbox { right: 14px; top: 14px; padding: 8px; }
  #radar { display: block; width: 168px; height: 168px; background: #070b12; }
  #feed { right: 14px; top: 210px; width: 232px; max-height: 190px; overflow: hidden; }
  #feed div { color: var(--dim); }
  #feed b { color: var(--ink); font-weight: 500; }
  #scores { left: 14px; top: 14px; min-width: 232px; }
  #scores table { border-collapse: collapse; width: 100%; }
  #scores td { padding: 1px 0; }
  #scores td.n { text-align: right; color: var(--dim); }
  .ai { color: var(--dim); font-size: 11px; }
  #help { left: 50%; transform: translateX(-50%); bottom: 14px; color: var(--dim); border: 0; background: none; }
  kbd {
    border: 1px solid #2b3a52; padding: 0 4px; color: var(--ink);
    border-radius: 2px; font: inherit;
  }
  #start {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(3, 5, 9, .93); z-index: 10; text-align: center;
  }
  #start h1 {
    font-size: 34px; letter-spacing: .34em; margin: 0 0 6px; font-weight: 400;
    color: var(--friend); text-transform: lowercase;
  }
  #start p { color: var(--dim); margin: 0 0 22px; }
  #ships { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 640px; margin-bottom: 22px; }
  .shipbtn {
    background: #0a0f18; border: 1px solid #22304a; color: var(--ink);
    padding: 10px 12px; cursor: pointer; font: inherit; width: 148px; text-align: left;
  }
  .shipbtn:hover, .shipbtn.sel { border-color: var(--friend); background: #0d1826; }
  .shipbtn small { display: block; color: var(--dim); font-size: 11px; }
  #go {
    background: var(--friend); color: #04121a; border: 0; padding: 11px 30px;
    font: inherit; letter-spacing: .16em; cursor: pointer; text-transform: uppercase;
  }
  #dead {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
    text-align: center; color: var(--enemy); letter-spacing: .2em; display: none;
  }
</style>

<div id="wrap">
  <canvas id="view"></canvas>
  <div class="panel" id="scores"></div>
  <div class="panel" id="radarbox"><canvas id="radar" width="336" height="336"></canvas></div>
  <div class="panel" id="feed"></div>
  <div class="panel" id="hud"></div>
  <div id="help" class="panel"></div>
  <div id="dead">DESTROYED</div>
</div>

<div id="start">
  <div>
    <h1>vectorwake</h1>
    <p>Frictionless flight. Energy is your health and your ammunition.<br>
       Pick a hull and fight eight AI pilots.</p>
    <div id="ships"></div>
    <button id="go">launch</button>
    <button id="duel" style="margin-left:8px;background:#0a0f18;color:#ffa552;border:1px solid #3a2a1a;padding:11px 22px;font:inherit;letter-spacing:.16em;cursor:pointer;text-transform:uppercase">duel</button>
    <button id="online" style="margin-left:8px;background:#0a0f18;color:#4fd6ff;border:1px solid #22304a;padding:11px 22px;font:inherit;letter-spacing:.16em;cursor:pointer;text-transform:uppercase">connect</button>
    <div style="margin-top:10px">
      <input id="url" value="ws://127.0.0.1:9010" style="background:#0a0f18;border:1px solid #22304a;color:#dfe9f5;padding:6px 8px;font:inherit;width:230px">
      <input id="pname" value="pilot" style="background:#0a0f18;border:1px solid #22304a;color:#dfe9f5;padding:6px 8px;font:inherit;width:110px">
    </div>
    <div style="margin-top:14px;color:#6c7a90">
      <label><input type="checkbox" id="fs"> fullscreen</label>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// vectorwake web client.
//
// The simulation is the project's C core compiled to WebAssembly. This page
// renders it and feeds it inputs; it decides nothing about the game. The AI
// pilots below emit the same button bitfields a human does, through the same
// call, which is the rule from docs/design/ai-players.md.
// ---------------------------------------------------------------------------

const WASM_B64 = "__WASM_BASE64__";

const TILE = 16, MAPT = 1024;
const BTN = { LEFT: 1, RIGHT: 2, THRUST: 4, REVERSE: 8, FIRE: 16, BOMB: 32 };
const EV = { FIRE: 1, BOUNCE: 2, HIT: 3, DEATH: 4, SPAWN: 5, EXPIRE: 6, PRIZE: 7 };
// Prize kinds, in the order the core defines them.
const UPGRADES = [
  { name: "energy",   short: "NRG", color: "#7fe3a0" },
  { name: "recharge", short: "RCH", color: "#4fd6ff" },
  { name: "speed",    short: "SPD", color: "#ffd166" },
  { name: "thrust",   short: "THR", color: "#ff9a5c" },
  { name: "rotation", short: "ROT", color: "#c79bff" },
];

const CLASSES = [
  { name: "Apex",    role: "interceptor", poly: [[0,-15],[7,10],[0,4],[-7,10]] },
  { name: "Wedge",   role: "bomber",      poly: [[0,-14],[11,11],[-11,11]] },
  { name: "Chord",   role: "skirmisher",  poly: [[0,-11],[14,4],[9,11],[-9,11],[-14,4]] },
  { name: "Anvil",   role: "heavy",       poly: [[-6,-13],[6,-13],[13,0],[9,12],[-9,12],[-13,0]] },
  { name: "Spire",   role: "support",     poly: [[0,-16],[8,0],[3,13],[-3,13],[-8,0]] },
  { name: "Cipher",  role: "stealth",     poly: [[0,-16],[4,8],[0,12],[-4,8]] },
  { name: "Facet",   role: "brawler",     poly: [[0,-12],[12,-3],[8,12],[-8,12],[-12,-3]] },
  { name: "Lattice", role: "denial",      poly: [[-4,-13],[4,-13],[4,-5],[13,-5],[13,5],[4,5],[4,13],[-4,13],[-4,5],[-13,5],[-13,-5],[-4,-5]] },
];

const BOT_NAMES = [
  "Kestrel", "Halcyon", "Vantage", "Ridgeline", "Sable", "Meridian",
  "Ozone", "Tessellate", "Quarry", "Nocturne", "Bramble", "Cinder",
];

let W = null;           // wasm exports
let mem8 = null;
let BTN_PTR = 1 << 20;  // scratch bytes for the per-ship button array
let ME = 0;
let pilots = [];        // metadata parallel to sim ship ids
let feed = [];
let hurt = 0;          // decays each frame; drives the damage flash
let pickup = null;     // most recent upgrade, for the HUD flash
let running = false;
let selected = 0;
let wantFullscreen = true;

// --- boot ------------------------------------------------------------------

function b64bytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function writeHelp() {
  document.getElementById("help").innerHTML =
    `<kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> fly &nbsp;` +
    `<kbd>Space</kbd> guns &nbsp; <kbd>Shift</kbd> bombs` +
    `<span style="opacity:.55"> &nbsp; or <kbd>Z</kbd>/<kbd>X</kbd>, ` +
    `or mouse buttons; <kbd>WASD</kbd> also flies</span>`;
}

async function goFullscreen() {
  try { await document.documentElement.requestFullscreen(); } catch (e) { /* fine windowed */ }
}

async function boot() {
  const { instance } = await WebAssembly.instantiate(b64bytes(WASM_B64), {});
  W = instance.exports;
  mem8 = new Uint8Array(W.memory.buffer);
  buildShipPicker();
  writeHelp();
}

function buildShipPicker() {
  const host = document.getElementById("ships");
  CLASSES.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "shipbtn" + (i === selected ? " sel" : "");
    b.innerHTML = `${c.name}<small>${c.role}</small>`;
    b.onclick = () => {
      selected = i;
      [...host.children].forEach((el, j) =>
        el.classList.toggle("sel", j === i));
    };
    host.appendChild(b);
  });
}

// --- world setup -----------------------------------------------------------

function startGame() {
  W.vw_init(0x5eed ^ (selected * 2654435761) >>> 0);
  pilots = [];

  ME = W.vw_spawn(selected, 0, 512, 522, 0);
  pilots.push({ name: "you", ai: null });

  // Eight AI pilots inside the arena, six against you and two alongside,
  // with a spread of skill and archetype so the room feels like a room.
  const layout = [
    [0, 1, 486, 486], [3, 1, 538, 486], [6, 1, 538, 538], [2, 1, 486, 538],
    [5, 1, 512, 478], [7, 1, 478, 512], [1, 0, 546, 512], [4, 0, 512, 546],
  ];
  layout.forEach((L, i) => {
    const [cls, team, tx, ty] = L;
    const id = W.vw_spawn(cls, team, tx, ty, (i * 8192) & 0xffff);
    pilots.push({
      name: BOT_NAMES[i],
      ai: makeBot(0.28 + (i % 5) * 0.16, id),
    });
  });

  document.getElementById("start").style.display = "none";
  if (wantFullscreen) goFullscreen();
  running = true;
  requestAnimationFrame(frame);
}

// --- AI --------------------------------------------------------------------
//
// A bot sees only what the page can see, produces a button bitfield, and has
// no other channel into the simulation. Skill is imperfection added: reaction
// delay, aim error, and how well it manages energy.

function makeBot(skill, id) {
  return {
    skill,
    id,
    react: Math.round(38 - skill * 30),   // frames between decisions
    aimErr: (1 - skill) * 0.42,           // radians of slop
    fireHold: 0,
    timer: 0,
    want: 0,
    jitter: Math.random() * 6.28,
  };
}

// With no enemy in reach, a bot goes shopping. Same input path as always.
function nearestPrize(b, within) {
  const mx = W.vw_ship_x(b.id) / 256, my = W.vw_ship_y(b.id) / 256;
  let bx = 0, by = 0, bd = within * within;
  let found = false;
  for (let i = 0, n = W.vw_prize_count(); i < n; i++) {
    if (!W.vw_prize_active(i)) continue;
    const dx = W.vw_prize_x(i) / 256 - mx, dy = W.vw_prize_y(i) / 256 - my;
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; bx = dx; by = dy; found = true; }
  }
  if (!found) return 0;
  return steerTo(b, bx, by);
}

function steerTo(b, dx, dy) {
  const want = Math.atan2(dx, -dy);
  const head = (W.vw_ship_heading(b.id) / 65536) * Math.PI * 2;
  let diff = want - head;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  let out = 0;
  if (diff > 0.06) out |= BTN.RIGHT; else if (diff < -0.06) out |= BTN.LEFT;
  if (Math.abs(diff) < 0.5) out |= BTN.THRUST;
  return out;
}

function seekPrize(b) {
  const mx = W.vw_ship_x(b.id) / 256, my = W.vw_ship_y(b.id) / 256;
  let bx = 0, by = 0, bd = 1e18;
  for (let i = 0, n = W.vw_prize_count(); i < n; i++) {
    if (!W.vw_prize_active(i)) continue;
    const dx = W.vw_prize_x(i) / 256 - mx, dy = W.vw_prize_y(i) / 256 - my;
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; bx = dx; by = dy; }
  }
  if (bd > 1e17) return 0;
  return steerTo(b, bx, by);
}

function botThink(b) {
  // Pick the nearest live enemy.
  const n = W.vw_ship_count();
  const myTeam = W.vw_ship_team(b.id);
  const mx = W.vw_ship_x(b.id) / 256, my = W.vw_ship_y(b.id) / 256;
  let best = -1, bestD = 1e18;
  for (let i = 0; i < n; i++) {
    if (i === b.id || !W.vw_ship_alive(i) || W.vw_ship_team(i) === myTeam) continue;
    const dx = W.vw_ship_x(i) / 256 - mx, dy = W.vw_ship_y(i) / 256 - my;
    const d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; best = i; }
  }
  if (best < 0) return seekPrize(b);

  // A green within easy reach is worth the detour even mid-fight, which is
  // how the original actually played.
  const near = nearestPrize(b, 200);
  if (near && W.vw_ship_energy(b.id) > W.vw_ship_max_energy(b.id) * 0.4)
    return near;

  const dist = Math.sqrt(bestD);
  const tx = W.vw_ship_x(best) / 256, ty = W.vw_ship_y(best) / 256;
  const tvx = W.vw_ship_vx(best) / 65536, tvy = W.vw_ship_vy(best) / 65536;

  // Lead the target: bullets travel 2 px/tick, so aim where it will be.
  const lead = Math.min(dist / 2, 140);
  const ax = tx + tvx * lead, ay = ty + tvy * lead;

  let want = Math.atan2(ax - mx, -(ay - my));     // 0 = up, clockwise
  want += (Math.random() - 0.5) * b.aimErr;

  const head = (W.vw_ship_heading(b.id) / 65536) * Math.PI * 2;
  let diff = want - head;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;

  let out = 0;
  if (diff > 0.05) out |= BTN.RIGHT;
  else if (diff < -0.05) out |= BTN.LEFT;

  // Hold a working range. Weak pilots misjudge it.
  const ideal = 130 + (1 - b.skill) * 90;
  if (dist > ideal * 1.15) out |= BTN.THRUST;
  else if (dist < ideal * 0.55) out |= BTN.REVERSE;

  // Fire when roughly on target and energy allows. Discipline scales with
  // skill: good pilots stop shooting before they are empty.
  const e = W.vw_ship_energy(b.id) / W.vw_ship_max_energy(b.id);
  const floor = 0.16 + b.skill * 0.28;
  if (Math.abs(diff) < 0.16 && e > floor) {
    out |= BTN.FIRE;
    if (dist < 320 && b.skill > 0.5 && (b.timer & 63) === 0) out |= BTN.BOMB;
  }
  return out;
}

// --- input -----------------------------------------------------------------

// Bindings are data so a settings screen can rewrite them later. Modern
// defaults: the left hand flies, the right hand shoots, and nothing is bound
// to a key the operating system or the browser has already claimed.
// Right hand steers on the arrows, left hand works the triggers, which is
// the hand position this genre has always used. The trigger keys are the
// ones the original put under the left hand, moved off Ctrl and Tab because
// macOS and the browser own those: guns under the thumb, bombs under the
// pinky, with Z and X for anyone who would rather use fingers.
const BINDINGS = {
  left:    { keys: ["ArrowLeft", "KeyA"] },
  right:   { keys: ["ArrowRight", "KeyD"] },
  thrust:  { keys: ["ArrowUp", "KeyW"] },
  reverse: { keys: ["ArrowDown", "KeyS"] },
  guns:    { keys: ["Space", "KeyZ"], mouse: [0] },
  bombs:   { keys: ["ShiftLeft", "ShiftRight", "KeyX"], mouse: [2] },
};
const ACTION_BIT = {
  left: BTN.LEFT, right: BTN.RIGHT, thrust: BTN.THRUST,
  reverse: BTN.REVERSE, guns: BTN.FIRE, bombs: BTN.BOMB,
};

const keys = new Set();
const mouse = new Set();

// Every bound key, plus Tab, is swallowed so the page never scrolls and focus
// never leaves the canvas.
function isBound(code) {
  for (const b of Object.values(BINDINGS)) if (b.keys.includes(code)) return true;
  return code === "Tab";
}

addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;  // let host shortcuts through
  keys.add(e.code);
  if (isBound(e.code)) e.preventDefault();
});
addEventListener("keyup", e => keys.delete(e.code));
addEventListener("blur", () => { keys.clear(); mouse.clear(); });

// Aiming is the nose (decision 17), which leaves both mouse buttons free.
addEventListener("mousedown", e => {
  if (!running) return;
  mouse.add(e.button);
  e.preventDefault();
});
addEventListener("mouseup", e => mouse.delete(e.button));
addEventListener("contextmenu", e => { if (running) e.preventDefault(); });

function myButtons() {
  let b = 0;
  for (const [action, bind] of Object.entries(BINDINGS)) {
    const down = bind.keys.some(k => keys.has(k)) ||
                 (bind.mouse || []).some(m => mouse.has(m));
    if (down) b |= ACTION_BIT[action];
  }
  return b;
}

// --- network -------------------------------------------------------------
//
// The server owns the truth. This client sends buttons, predicts its own ship
// forward from the last snapshot, and accepts every correction the server
// sends. Nothing here decides a hit, a death, or a pickup.

const C2S_JOIN = 1, C2S_INPUT = 2, C2S_DUEL = 3;
const S2C_WELCOME = 1, S2C_SNAPSHOT = 2, S2C_ROSTER = 3, S2C_KILL = 4,
      S2C_BANNER = 5;
const ratings = new Map();   // ship -> rating, from the server

let net = null;          // WebSocket when online, null when playing solo
// errPx is the distance between where we predicted our own ship would be and
// where the server says it is, after replaying the inputs the server had not
// seen. That is the number that decides whether prediction is working; a
// whole-state hash would differ every snapshot simply because remote ships
// moved, which says nothing about our own accuracy.
let netStats = { snaps: 0, errPx: 0, errMax: 0, maxRewind: 0, bytes: 0 };
const inputLog = new Map();   // predicted tick -> buttons, for replay

function connect(url, className, name) {
  return new Promise((resolve, reject) => {
    const ws = new WebSocket(url);
    ws.binaryType = "arraybuffer";
    ws.onopen = () => {
      const nb = new TextEncoder().encode(name);
      const msg = new Uint8Array(2 + nb.length);
      msg[0] = C2S_JOIN; msg[1] = className;
      msg.set(nb, 2);
      ws.send(msg);
    };
    ws.onmessage = e => {
      const d = new Uint8Array(e.data);
      if (d[0] === S2C_WELCOME) {
        ME = d[1];
        net = ws;
        resolve();
      } else if (d[0] === S2C_SNAPSHOT) {
        onSnapshot(d);
      } else if (d[0] === S2C_ROSTER) {
        onRoster(d);
      } else if (d[0] === S2C_KILL) {
        onKill(d);
      } else if (d[0] === S2C_BANNER) {
        banner = new TextDecoder().decode(d.subarray(1));
      }
    };
    ws.onerror = () => reject(new Error("connection failed"));
    ws.onclose = () => { net = null; };
  });
}

function onRoster(d) {
  let o = 2;
  const n = d[1];
  for (let i = 0; i < n; i++) {
    const ship = d[o++], isAi = d[o++] === 1;
    const rating = (d[o] | (d[o + 1] << 8)) << 16 >> 16;  // i16
    o += 2;
    const len = d[o++];
    const name = new TextDecoder().decode(d.subarray(o, o + len));
    o += len;
    pilots[ship] = { name, ai: isAi ? { server: true } : null };
    ratings.set(ship, rating);
  }
}

function onKill(d) {
  const victim = d[1], killer = d[2];
  const vr = (d[3] | (d[4] << 8)) << 16 >> 16;
  const kr = (d[5] | (d[6] << 8)) << 16 >> 16;
  const contributors = d[7];
  ratings.set(victim, vr);
  ratings.set(killer, kr);
  const vn = pilots[victim] ? pilots[victim].name : "?";
  const kn = pilots[killer] ? pilots[killer].name : "?";
  const assist = contributors > 1 ? ` <span style="opacity:.6">+${contributors - 1} assist</span>` : "";
  feed.unshift(`<b>${kn}</b> killed <b>${vn}</b>${assist}`);
  feed = feed.slice(0, 9);
}

function onSnapshot(d) {
  // header: type, your ship, last input tick echoed back
  const ackTick = d[2] | (d[3] << 8) | (d[4] << 16) | (d[5] << 24);
  const body = d.subarray(6);
  netStats.snaps++;
  netStats.bytes += d.length;

  const px = W.vw_ship_x(ME), py = W.vw_ship_y(ME);
  const bufPtr = W.vw_netbuf();
  new Uint8Array(W.memory.buffer, bufPtr, body.length).set(body);
  if (W.vw_apply_snapshot(body.length) !== 0) return;

  // Replay the local inputs the server had not yet applied when it sent
  // this. At 100 Hz and a fifth of a second of history that is at most a
  // few dozen steps of one ship, cheap enough to do inside a frame.
  const from = W.vw_tick();
  let steps = 0;
  for (let tk = from + 1; tk <= predictedTick; tk++) {
    W.vw_replay(ME, inputLog.get(tk) || 0);
    steps++;
  }
  if (steps > netStats.maxRewind) netStats.maxRewind = steps;
  const dx = (W.vw_ship_x(ME) - px) / 256, dy = (W.vw_ship_y(ME) - py) / 256;
  const err = Math.hypot(dx, dy);
  netStats.errPx = err;
  // The first snapshots after joining move the ship from nowhere to its real
  // position, which is a teleport rather than a misprediction.
  if (netStats.snaps > 3 && err > netStats.errMax) netStats.errMax = err;

  for (const k of inputLog.keys()) if (k < from - 400) inputLog.delete(k);
  predictedTick = W.vw_tick();
  void ackTick;
}

function sendInput(buttons, tick) {
  if (!net || net.readyState !== 1) return;
  const m = new Uint8Array(7);
  m[0] = C2S_INPUT;
  m[1] = buttons & 0xff; m[2] = (buttons >> 8) & 0xff;
  m[3] = tick & 0xff; m[4] = (tick >> 8) & 0xff;
  m[5] = (tick >> 16) & 0xff; m[6] = (tick >>> 24) & 0xff;
  net.send(m);
}

let predictedTick = 0;
let banner = "";        // the mode's line: warmup, countdown, duel score

// Ask the server for a one on one against a rating-matched opponent. It
// builds the room, so this client simply changes seats.
function requestDuel() {
  if (!net || net.readyState !== 1) return;
  const nb = new TextEncoder().encode(
    document.getElementById("pname").value || "pilot");
  const m = new Uint8Array(2 + nb.length);
  m[0] = C2S_DUEL; m[1] = selected;
  m.set(nb, 2);
  net.send(m);
  ratings.clear();
  pilots = [];
  feed = [];
  netStats = { snaps: 0, errPx: 0, errMax: 0, maxRewind: 0, bytes: 0 };
}

// --- loop ------------------------------------------------------------------
//
// The simulation runs at a fixed 100 Hz regardless of display rate, with the
// accumulator under our control. Rendering interpolates nothing yet; at 100 Hz
// it does not need to.

const HZ = 100, STEP_MS = 1000 / HZ;
let acc = 0, last = 0;

function frame(now) {
  if (!running) return;
  if (!last) last = now;
  acc += Math.min(now - last, 250);   // never simulate through a long stall
  last = now;

  while (acc >= STEP_MS) {
    stepOnce();
    acc -= STEP_MS;
  }
  render();
  requestAnimationFrame(frame);
}

function stepOnce() {
  const n = W.vw_ship_count();
  const mine = myButtons();

  if (net) {
    // Online: predict this ship only. Everything else arrives in snapshots.
    predictedTick = W.vw_tick() + 1;
    inputLog.set(predictedTick, mine);
    sendInput(mine, predictedTick);
    W.vw_replay(ME, mine);
    drainEvents();
    return;
  }

  mem8[BTN_PTR + ME] = mine;
  for (let i = 0; i < n; i++) {
    const p = pilots[i];
    if (!p || !p.ai || p.ai.server) continue;
    const b = p.ai;
    b.timer++;
    if (b.timer % b.react === 0) b.want = botThink(b);
    mem8[BTN_PTR + i] = W.vw_ship_alive(i) ? b.want : 0;
  }
  W.vw_step(BTN_PTR, n);

  drainEvents();
}

function drainEvents() {
  for (let e = 0, c = W.vw_event_count(); e < c; e++) {
    if (W.vw_event_type(e) === EV.HIT && W.vw_event_a(e) === ME) hurt = 1;
    if (W.vw_event_type(e) === EV.PRIZE && W.vw_event_a(e) === ME) {
      const u = UPGRADES[W.vw_event_b(e)];
      if (u) pickup = { name: u.name, color: u.color, t: 1 };
    }
    if (W.vw_event_type(e) !== EV.DEATH) continue;
    if (net) continue;   // online, the server reports kills with ratings
    const victim = W.vw_event_a(e), killer = W.vw_event_b(e);
    const vn = pilots[victim] ? pilots[victim].name : "?";
    const kn = pilots[killer] ? pilots[killer].name : "?";
    feed.unshift(`<b>${kn}</b> killed <b>${vn}</b>`);
    feed = feed.slice(0, 9);
  }
}

// --- rendering -------------------------------------------------------------

const cv = document.getElementById("view"), cx = cv.getContext("2d");
const rv = document.getElementById("radar"), rx = rv.getContext("2d");
let stars = [];

function resize() {
  const d = devicePixelRatio || 1;
  cv.width = innerWidth * d;
  cv.height = innerHeight * d;
  cx.setTransform(d, 0, 0, d, 0, 0);
  stars = [];
  for (let i = 0; i < 220; i++)
    stars.push({ x: Math.random() * 16384, y: Math.random() * 16384,
                 z: 0.35 + Math.random() * 0.5 });
}
addEventListener("resize", resize);
resize();

// Decision 13: the camera shows a fixed slice of the world, so a phone and an
// ultrawide see the same amount of game.
const VIEW_TILES = 34;

function render() {
  const w = innerWidth, h = innerHeight;
  const scale = h / (VIEW_TILES * TILE);
  const camx = W.vw_ship_x(ME) / 256, camy = W.vw_ship_y(ME) / 256;

  cx.fillStyle = "#05070c";
  cx.fillRect(0, 0, w, h);

  // parallax field
  cx.fillStyle = "#1b2740";
  for (const s of stars) {
    const sx = (s.x - camx * s.z) * scale % w, sy = (s.y - camy * s.z) * scale % h;
    cx.fillRect((sx + w) % w, (sy + h) % h, 1, 1);
  }

  cx.save();
  cx.translate(w / 2, h / 2);
  cx.scale(scale, scale);
  cx.translate(-camx, -camy);

  drawTiles(camx, camy, w / scale, h / scale);
  drawPrizes();
  drawWeapons();
  drawShips();

  cx.restore();

  if (hurt > 0.01) {
    const g = cx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.28,
                                      w / 2, h / 2, Math.max(w, h) * 0.62);
    g.addColorStop(0, "rgba(255,80,90,0)");
    g.addColorStop(1, `rgba(255,80,90,${0.42 * hurt})`);
    cx.fillStyle = g;
    cx.fillRect(0, 0, w, h);
    hurt *= 0.88;
  }

  if (banner) {
    cx.save();
    cx.font = "600 26px ui-monospace, monospace";
    cx.textAlign = "center";
    cx.fillStyle = "rgba(223,233,245,.92)";
    cx.fillText(banner, w / 2, 64);
    cx.restore();
  }

  drawHud();
  drawRadar(camx, camy);
}

function drawTiles(camx, camy, vw, vh) {
  const t0x = Math.max(0, Math.floor((camx - vw / 2) / TILE) - 1);
  const t1x = Math.min(MAPT - 1, Math.ceil((camx + vw / 2) / TILE) + 1);
  const t0y = Math.max(0, Math.floor((camy - vh / 2) / TILE) - 1);
  const t1y = Math.min(MAPT - 1, Math.ceil((camy + vh / 2) / TILE) + 1);
  cx.lineWidth = 1;
  for (let ty = t0y; ty <= t1y; ty++) {
    for (let tx = t0x; tx <= t1x; tx++) {
      if (!W.vw_solid(tx, ty)) continue;
      cx.fillStyle = "#0d1726";
      cx.fillRect(tx * TILE, ty * TILE, TILE, TILE);
      cx.strokeStyle = "#22344f";
      cx.strokeRect(tx * TILE + .5, ty * TILE + .5, TILE - 1, TILE - 1);
    }
  }
}

function teamColor(team) {
  return team === W.vw_ship_team(ME) ? "#4fd6ff" : "#ffa552";
}

function drawShips() {
  const n = W.vw_ship_count();
  for (let i = 0; i < n; i++) {
    if (!W.vw_ship_alive(i)) continue;
    const x = W.vw_ship_x(i) / 256, y = W.vw_ship_y(i) / 256;
    const a = (W.vw_ship_heading(i) / 65536) * Math.PI * 2;
    const col = teamColor(W.vw_ship_team(i));
    const poly = CLASSES[W.vw_ship_cls(i)].poly;

    cx.save();
    cx.translate(x, y);
    cx.rotate(a);

    // thruster, drawn behind the hull
    if (i === ME ? (myButtons() & BTN.THRUST)
                 : (pilots[i] && pilots[i].ai && (pilots[i].ai.want & BTN.THRUST))) {
      cx.beginPath();
      cx.moveTo(-3, 11); cx.lineTo(0, 17 + Math.random() * 5); cx.lineTo(3, 11);
      cx.fillStyle = "rgba(255,190,120,.85)";
      cx.fill();
    }

    cx.beginPath();
    poly.forEach((p, k) => k ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1]));
    cx.closePath();
    cx.fillStyle = i === ME ? "rgba(79,214,255,.20)" : "rgba(10,16,26,.85)";
    cx.fill();
    cx.lineWidth = i === ME ? 2 : 1.4;
    cx.strokeStyle = col;
    cx.stroke();
    cx.restore();

    // energy pip above the hull, so a wounded enemy reads at a glance
    const e = W.vw_ship_energy(i) / W.vw_ship_max_energy(i);
    if (e < 0.999) {
      cx.fillStyle = "rgba(20,28,40,.9)";
      cx.fillRect(x - 12, y - 24, 24, 3);
      cx.fillStyle = col;
      cx.fillRect(x - 12, y - 24, 24 * Math.max(0, e), 3);
    }
    if (i !== ME) {
      cx.fillStyle = "rgba(160,180,205,.75)";
      cx.font = "7px ui-monospace, monospace";
      cx.textAlign = "center";
      cx.fillText(pilots[i] ? pilots[i].name : "", x, y + 30);
    }
  }
}

function drawPrizes() {
  const spin = (performance.now() / 600) % 6.2832;
  for (let i = 0, n = W.vw_prize_count(); i < n; i++) {
    if (!W.vw_prize_active(i)) continue;
    const x = W.vw_prize_x(i) / 256, y = W.vw_prize_y(i) / 256;
    const u = UPGRADES[W.vw_prize_type(i)] || UPGRADES[0];
    cx.save();
    cx.translate(x, y);
    cx.rotate(spin);
    cx.beginPath();
    cx.moveTo(0, -6); cx.lineTo(6, 0); cx.lineTo(0, 6); cx.lineTo(-6, 0);
    cx.closePath();
    cx.fillStyle = u.color + "44";
    cx.fill();
    cx.strokeStyle = u.color;
    cx.lineWidth = 1.4;
    cx.stroke();
    cx.restore();
  }
}

function drawWeapons() {
  const n = W.vw_weapon_count();
  for (let i = 0; i < n; i++) {
    const x = W.vw_weapon_x(i) / 256, y = W.vw_weapon_y(i) / 256;
    const t = W.vw_weapon_type(i);
    if (t === 2) {
      cx.beginPath();
      cx.arc(x, y, 4.5, 0, 6.2832);
      cx.fillStyle = "#ff5ea8";
      cx.fill();
      cx.beginPath();
      cx.arc(x, y, 8, 0, 6.2832);
      cx.strokeStyle = "rgba(255,94,168,.45)";
      cx.lineWidth = 1;
      cx.stroke();
    } else {
      const vx = W.vw_weapon_vx(i) / 65536, vy = W.vw_weapon_vy(i) / 65536;
      cx.strokeStyle = "rgba(190,225,255,.55)";
      cx.lineWidth = 1.2;
      cx.beginPath();
      cx.moveTo(x - vx * 3, y - vy * 3);
      cx.lineTo(x, y);
      cx.stroke();
      cx.fillStyle = "#eaf6ff";
      cx.fillRect(x - 1.5, y - 1.5, 3, 3);
    }
  }
}

function drawHud() {
  const alive = W.vw_ship_alive(ME);
  document.getElementById("dead").style.display = alive ? "none" : "block";

  const e = W.vw_ship_energy(ME) / W.vw_ship_max_energy(ME);
  const sp = Math.hypot(W.vw_ship_vx(ME), W.vw_ship_vy(ME)) / 65536 * 100 / TILE;
  const ups = UPGRADES.map((u, i) => {
    const n = W.vw_ship_up(ME, i);
    return `<span style="color:${n ? u.color : "#3a465c"}">${u.short}${n ? "&times;" + n : ""}</span>`;
  }).join(" ");
  const note = pickup && pickup.t > 0.02
    ? `<div style="color:${pickup.color};opacity:${pickup.t.toFixed(2)}">+ ${pickup.name}</div>`
    : "";
  if (pickup) pickup.t *= 0.97;

  document.getElementById("hud").innerHTML =
    `<div class="row"><span>${CLASSES[W.vw_ship_cls(ME)].name}</span>` +
    `<span>${W.vw_ship_kills(ME)}k / ${W.vw_ship_deaths(ME)}d</span></div>` +
    `<div id="bar"><div id="barfill" style="width:${(e * 100).toFixed(1)}%"></div></div>` +
    `<div class="row" style="margin-top:6px;color:var(--dim)">` +
    `<span>energy ${Math.round(e * 100)}%</span><span>${sp.toFixed(1)} tiles/s</span></div>` +
    `<div style="margin-top:5px;letter-spacing:.06em">${ups}</div>${note}` +
    (net ? `<div class="row" style="margin-top:5px;color:var(--dim)">` +
           `<span>online</span><span>err ${netStats.errPx.toFixed(1)}px ` +
           `&middot; peak ${netStats.errMax.toFixed(0)}px</span></div>` : "");

  const n = W.vw_ship_count();
  const rows = [];
  for (let i = 0; i < n; i++)
    rows.push({ i, k: W.vw_ship_kills(i), d: W.vw_ship_deaths(i) });
  rows.sort((a, b) => b.k - a.k || a.d - b.d);
  document.getElementById("scores").innerHTML =
    "<table>" + rows.slice(0, 9).map(r => {
      const p = pilots[r.i] || { name: "?" };
      const me = r.i === ME;
      const col = teamColor(W.vw_ship_team(r.i));
      const rt = ratings.has(r.i) ? `<td class="n">${ratings.get(r.i)}</td>` : "";
      return `<tr><td style="color:${col}">${me ? "&#9656; " : ""}${p.name}` +
             `${p.ai ? ' <span class="ai">AI</span>' : ""}</td>` +
             `<td class="n">${r.k} / ${r.d}</td>${rt}</tr>`;
    }).join("") + "</table>";

  document.getElementById("feed").innerHTML =
    feed.map(f => `<div>${f}</div>`).join("") || '<div>&nbsp;</div>';
}

function drawRadar(camx, camy) {
  const S = 336, R = 150 * TILE;   // radar covers 150 tiles around you
  rx.fillStyle = "#070b12";
  rx.fillRect(0, 0, S, S);
  rx.strokeStyle = "#1b2942";
  rx.strokeRect(.5, .5, S - 1, S - 1);

  const step = 6;
  const t0x = Math.floor((camx - R) / TILE), t1x = Math.ceil((camx + R) / TILE);
  const t0y = Math.floor((camy - R) / TILE), t1y = Math.ceil((camy + R) / TILE);
  rx.fillStyle = "#16243a";
  for (let ty = t0y; ty <= t1y; ty += step) {
    for (let tx = t0x; tx <= t1x; tx += step) {
      if (!W.vw_solid(tx, ty)) continue;
      const px = (tx * TILE - camx + R) / (2 * R) * S;
      const py = (ty * TILE - camy + R) / (2 * R) * S;
      rx.fillRect(px, py, 3, 3);
    }
  }
  const n = W.vw_ship_count();
  for (let i = 0; i < n; i++) {
    if (!W.vw_ship_alive(i)) continue;
    const px = (W.vw_ship_x(i) / 256 - camx + R) / (2 * R) * S;
    const py = (W.vw_ship_y(i) / 256 - camy + R) / (2 * R) * S;
    if (px < 0 || py < 0 || px > S || py > S) continue;
    rx.fillStyle = i === ME ? "#ffffff" : teamColor(W.vw_ship_team(i));
    const s = i === ME ? 5 : 4;
    rx.fillRect(px - s / 2, py - s / 2, s, s);
  }
}

document.getElementById("go").onclick = () => {
  wantFullscreen = document.getElementById("fs").checked;
  startGame();
};

document.getElementById("duel").onclick = async () => {
  if (!net) {
    await document.getElementById("online").onclick();
    setTimeout(requestDuel, 400);
  } else {
    requestDuel();
  }
};

document.getElementById("online").onclick = async () => {
  const btn = document.getElementById("online");
  btn.textContent = "connecting";
  try {
    W.vw_init(1);                       // the server owns state from here
    pilots = [];
    await connect(document.getElementById("url").value,
                  selected,
                  document.getElementById("pname").value || "pilot");
    document.getElementById("start").style.display = "none";
    running = true;
    requestAnimationFrame(frame);
  } catch (e) {
    btn.textContent = "connect failed";
    setTimeout(() => (btn.textContent = "connect"), 1600);
  }
};
addEventListener("keydown", e => {
  if (!running && e.code === "Enter") startGame();
});

boot();
</script>
