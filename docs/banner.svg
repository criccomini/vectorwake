<!-- The wordmark lockup from ui.lua, sized for the README: the
     two-row mark of client/web/icon.svg standing left of the name, mark at
     0.74 of the word's em with 0.30 of one between them. One line is the
     middle of the plate: the mark's center, and the middle of the band from
     the baseline to the top of the o, which is where the eye finds the middle
     of a word with no descenders. So the mark's ends hang under the word's
     baseline and the t and the k reach over the mark, the way they do in the
     game. ui.lua arrives within 0.027 em of this from the other side, hanging
     the mark LOGO_DROP under the middle of the box menu.ttf sets a line in
     (+0.992 to -0.308 em). The name is Chakra Petch (client/ui/menu.ttf, OFL 1.1)
     converted to outlines, so the banner carries its own type. The ground is
     the icon tile's, but square and 1280 wide: wider than the column that
     shows it, so it is scaled to the page's full width. -->
