name: client bundle

# Build the browser bundle and publish it, so nobody builds it by hand.
#
# It was hand-built and committed until now, which cost a live outage: a commit
# changed the simulation core, the bundle was not rebuilt, and the deployed client
# read a wire the server had stopped writing -- a player joining Chaos saw
# DESTROYED on a perfectly healthy fleet. The core refuses that mismatch now, and
# CI refused to merge the next one, but both are guards around a manual step that
# should not exist.
#
# sim/** is in the trigger and that is the whole point: the bundle links the same
# simulation core the server does, so a change to the core is a change to the
# client whether or not any Lua moved.

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "sim/**"
      - "deploy/Dockerfile.client"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - "sim/**"
      - "deploy/Dockerfile.client"
      - ".github/workflows/client.yml"
  workflow_dispatch:

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned. bob is the compiler for this client, and an unpinned one means the
  # page can change without a commit. 1.13.0 is what client/README.md documents,
  # and it is the version that needs Java 25.
  BOB_VERSION: "1.13.0"

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # build.sh stamps the page with `git rev-parse --short HEAD`, so the start
      # screen says which build a player is looking at. That stamp is why this
      # needs a real checkout and not a source tarball.
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # 208 MB, and it changes only when BOB_VERSION does.
      - name: cache bob
        id: bob
        uses: actions/cache@v4
        with:
          path: /tmp/bob.jar
          key: bob-${{ env.BOB_VERSION }}
      - name: fetch bob
        if: steps.bob.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/bob.jar \
            "https://github.com/defold/defold/releases/download/${BOB_VERSION}/bob.jar"
          # A truncated download becomes a build failure much later and much less
          # clearly, so confirm it is really bob before trusting it.
          unzip -p /tmp/bob.jar META-INF/MANIFEST.MF | grep -q 'com.dynamo.bob.Bob'
          ls -l /tmp/bob.jar

      # Native extensions are compiled by Defold's own build server, so this step
      # needs the network and can fail for reasons that have nothing to do with
      # this repository. Worth knowing when it goes red.
      - name: build the bundle
        run: JAVA_HOME=$JAVA_HOME ./client/build.sh wasm-web release bundle

      - name: fold it into one file
        run: |
          mkdir -p page
          python3 client/tools/single_file.py \
            client/bundle/wasm-web/vectorwake page/index.html --fragment
          ls -l page/

      - uses: docker/setup-buildx-action@v3
      - name: log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: short sha
        id: rev
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          # The built page alone is the context. Pointing this at the repository
          # would ship the whole tree, including the unpacked bundle, to build a
          # layer that holds one file.
          context: page
          file: ./deploy/Dockerfile.client
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}-client:sha-${{ steps.rev.outputs.short }}
            ghcr.io/${{ github.repository }}-client:prod
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64
          provenance: false
