name: caddy image

# Caddy with the Vultr DNS provider, published so the host does not compile it.
#
# Its own workflow rather than a job in image.yml, because it changes when Caddy
# or the module changes and not when the game does. Nothing here rebuilds on a
# push that touches the simulation.

on:
  push:
    branches: [main]
    paths: ["deploy/Dockerfile.caddy", ".github/workflows/caddy.yml"]
  pull_request:
    paths: ["deploy/Dockerfile.caddy", ".github/workflows/caddy.yml"]
  # So a Caddy release can be picked up without an empty commit.
  workflow_dispatch:

concurrency:
  group: caddy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile asserts `dns.providers.vultr` is in the binary, so this
      # step failing is the module being absent rather than a flaky network.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.caddy
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}-caddy:prod
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy
          platforms: linux/amd64
          provenance: false
