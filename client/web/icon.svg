<!-- vectorwake's mark: six strokes, \|\|\|, read as the V of
     vector and the W of wake. Each wedge is a diagonal falling into a
     vertical and meeting it on the baseline; one gap throughout, so
     nothing marks where one letter stops and the next starts. The
     template embeds a favicon cut of this and two PNGs as data URIs,
     and ui.lua draws the same six strokes beside the wordmark. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><path d="M92,0H512V420L420,512H0V92Z" fill="#05070c"/><path d="M4.0,106.0 L154.0,406.0" fill="none" stroke="#ffa552" stroke-width="19.5" stroke-linecap="square"/><path d="M154.0,406.0 L154.0,106.0" fill="none" stroke="#ffa552" stroke-width="19.5" stroke-linecap="square"/><path d="M181.0,106.0 L331.0,406.0" fill="none" stroke="#4fd6ff" stroke-width="19.5" stroke-linecap="square"/><path d="M331.0,406.0 L331.0,106.0" fill="none" stroke="#4fd6ff" stroke-width="19.5" stroke-linecap="square"/><path d="M358.0,106.0 L508.0,406.0" fill="none" stroke="#4fd6ff" stroke-width="19.5" stroke-linecap="square"/><path d="M508.0,406.0 L508.0,106.0" fill="none" stroke="#4fd6ff" stroke-width="19.5" stroke-linecap="square"/></svg>
