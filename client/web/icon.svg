<!-- vectorwake's mark: six strokes, \|\|\|, read as the V of
     vector and the W of wake. Each wedge is a wake falling into a vertical and
     meeting it on the baseline; one gap throughout, so nothing marks where one
     letter stops and the next starts. A wake thickens and brightens as it
     falls, the way a round's own trail does, which is why it is a filled taper
     under a gradient rather than a stroke: SVG cannot vary a stroke's width
     along its length. The template embeds a heavier favicon cut of this and
     two PNGs as data URIs, and ui.lua draws the same six strokes beside the
     wordmark. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><defs><linearGradient id="w0" gradientUnits="userSpaceOnUse" x1="20.8" y1="116.0" x2="160.8" y2="396.0"><stop offset="0" stop-color="#ffa552" stop-opacity="0"/><stop offset="1" stop-color="#ffa552" stop-opacity="1"/></linearGradient><linearGradient id="w1" gradientUnits="userSpaceOnUse" x1="186.0" y1="116.0" x2="326.0" y2="396.0"><stop offset="0" stop-color="#4fd6ff" stop-opacity="0"/><stop offset="1" stop-color="#4fd6ff" stop-opacity="1"/></linearGradient><linearGradient id="w2" gradientUnits="userSpaceOnUse" x1="351.2" y1="116.0" x2="491.2" y2="396.0"><stop offset="0" stop-color="#4fd6ff" stop-opacity="0"/><stop offset="1" stop-color="#4fd6ff" stop-opacity="1"/></linearGradient></defs><path d="M92,0H512V420L420,512H0V92Z" fill="#05070c"/><path d="M18.4,117.2 L152.7,400.1 L168.9,391.9 L23.2,114.8 Z" fill="url(#w0)"/><path d="M160.8,396.0 L160.8,116.0" fill="none" stroke="#ffa552" stroke-width="18.2" stroke-linecap="square"/><path d="M183.6,117.2 L317.9,400.1 L334.1,391.9 L188.4,114.8 Z" fill="url(#w1)"/><path d="M326.0,396.0 L326.0,116.0" fill="none" stroke="#4fd6ff" stroke-width="18.2" stroke-linecap="square"/><path d="M348.8,117.2 L483.1,400.1 L499.3,391.9 L353.6,114.8 Z" fill="url(#w2)"/><path d="M491.2,396.0 L491.2,116.0" fill="none" stroke="#4fd6ff" stroke-width="18.2" stroke-linecap="square"/></svg>
