<!-- vectorwake's mark: two hulls passing on a course tilted off
     vertical, each nose a little past the other's tail, drawn as the
     silhouette the simulation flies (hull_extent's 20 fore, 11 aft,
     10 half width, chamfered tail) and nothing else. The template
     embeds a favicon cut of this and two PNGs as data URIs, and
     ui.lua draws the same pair beside the wordmark. -->
