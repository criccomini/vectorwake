<!-- The full-size Vectorwake icon, for the installed app.
     The same drawing the site header carries, at the same weights: the two
     rows of three wedges as filled shapes, solid, with the ordinary 0.6 cut.
     favicon.svg is this shape again at the heavier 3.5 cut, which is the one
     difference between a tab and an installed icon.
     It was a set of stroked lines with a gradient fading each diagonal out
     toward its start, which made the install icon the one place the mark was
     drawn a different way and read a different weight. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <path d="M0 0H512V512H0Z" fill="#05070c"/>
  <g transform="translate(109 74) scale(3.5)" stroke-width="0.6" stroke-linejoin="miter">
    <path fill="#ffa552" stroke="#ffa552" d="M0 2h4l24 48h-4zM24.2 2h3.6v48h-3.6z"/>
    <path fill="#3f4b60" stroke="#3f4b60" d="M28 2h4l24 48h-4zM52.2 2h3.6v48h-3.6zM56 2h4l24 48h-4zM80.2 2h3.6v48h-3.6zM0 54h4l24 48h-4zM24.2 54h3.6v48h-3.6z"/>
    <path fill="#4fd6ff" stroke="#4fd6ff" d="M28 54h4l24 48h-4zM52.2 54h3.6v48h-3.6zM56 54h4l24 48h-4zM80.2 54h3.6v48h-3.6z"/>
  </g>
</svg>
