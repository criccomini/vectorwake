# A vectorwake zone.
#
# Everything an operator tunes lives here rather than in the server's source,
# which is the claim behind zones-are-content in docs/architecture. Anything
# left out keeps the value the simulation core ships with, so a short file is
# a legal file.
#
# The server re-reads this while running. Save it and the numbers change; no
# restart, nobody disconnected. A broken edit is logged and ignored rather
# than taking the zone down.

name = "first light"
description = "the reference zone: four flags, eight hulls, nine pilots"
listen = "127.0.0.1:9010"
max_players = 16

# Names here cannot join. Root-level keys must sit above every [table]:
# written below one, TOML reads them as belonging to that table instead,
# which the server now reports rather than ignoring.
bans = []

[arena]
mode = "warzone"
flags = 4

# Walls are inelastic. bounce is the speed a hit gives back out of 16, and
# friction is the speed retained along the wall. 16 and 16 would be lossless.
bounce = 10
friction = 14

respawn_delay = 300   # ticks, so three seconds
prize_delay = 100     # a green every second until the map is full
prize_max = 20

# Per-hull tuning, in settings-file units. Name the hull and set only what
# you want to change; upgrades climb toward whatever ceiling you give.
[[arena.ships]]
name = "Apex"
speed = 4900
thrust = 30
rotation = 420
energy = 1350
recharge = 1500

[[arena.ships]]
name = "Anvil"
speed = 3200
thrust = 14
rotation = 240
energy = 2600
recharge = 1000

# Authority is a set of named powers rather than a rank, the way ASSS did it.
[[staff]]
name = "chris"
capabilities = ["ban", "setmode", "reload"]

