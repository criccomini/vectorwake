# A vectorwake zone.
#
# Everything an operator tunes lives here rather than in the server's source,
# which is the claim behind zones-are-content in docs/architecture. Anything
# left out keeps the value the simulation core ships with, so a short file is
# a legal file -- and a key left out is different from a key set to zero,
# which is why `bounce = 0` is a wall that gives nothing back rather than a
# wall that means "use the default".
#
# The server re-reads this while running. Save it and the numbers change; no
# restart, nobody disconnected. A broken edit is logged and ignored rather
# than taking the zone down. The two exceptions are `mode` and `flags`, which
# settle when the arena opens: changing what a round is for while one is being
# played is not a tuning change.

name = "first light"
listen = "127.0.0.1:9010"

# TLS. Set both and the zone serves wss instead of ws. A page delivered
# over https may only open wss -- browsers refuse a plain ws socket from
# a secure origin, with loopback the one exception -- so a zone that
# strangers reach from a hosted client needs these.
tls_cert = ""
tls_key = ""
# Humans this zone admits. The room may hold more seats than this: max_ships
# under [arena] sizes the room and this bounds how many of its seats people get,
# which is what leaves the bot roster somewhere to sit.
max_players = 16

# Names here cannot join. Root-level keys must sit above every [table]:
# written below one, TOML reads them as belonging to that table instead,
# which the server now reports rather than ignoring.
bans = []

[arena]
mode = "warzone"
flags = 4

# Misc:BounceFactor: the speed a hit gives back, out of 16, and 16 is the
# original's, so a wall costs a ship nothing head on. friction is the speed
# retained along the face, which the original has no setting for.
bounce = 16
friction = 14

# Pilots the room holds at once, bots included. 255 is the ceiling and not a
# preference: a ship index is one byte everywhere it appears, and 255 is already
# the "no ship" value in those fields. Leaving this out keeps 64, which is
# four times what the original aimed a public room at -- its DesiredPlaying
# defaults to 15 and exists only to decide when to open another arena. Widening
# is cheap (50 us a tick at the ceiling against 13.5 at 64) so the reason to
# stay near 64 is how the game plays, not what it costs.
max_ships = 64

respawn_delay = 400   # ticks, so four seconds

# How precisely a ship lands on the map's spawn point for its side.
#
# Zero, the default, puts it exactly on the tile. Above zero it lands on a
# random tile within that many of the point instead, redrawn on every death.
# The point is chosen first either way, so the map still decides which part of
# it a side comes back to.
#
# Exactly on the tile stacks a roster: a point is one tile, and a room with more
# ships than the map has points puts several of them on the same one with
# nothing between them. Size the radius by the crowd it has to spread, measured
# as seconds of bullet flight to the nearest enemy rather than in tiles. Alpha
# runs 60 for a bit over three seconds at the 51 ships one of its rooms holds.
#
# A map that names no spawn points has nothing to aim at, and there a radius
# scatters about the center of the map, which is what the original did before it
# had spawn points at all.
#
# spawn_radius = 60

# Whether a client marks the map's spawn tiles. Worth turning off in a mode that
# does not want one side's home end advertised to the other: the mark is drawn
# for every spawn on the map, the enemy's included and in the enemy's color.
#
# show_spawns = true

# Flags: how close a ship takes one from, and how long a dropped one is
# untouchable so a carrier cannot juggle their own.
flag_radius = 18
flag_drop_cooldown = 200

# Doors breathe. A cycle is open then shut, and a door's variant leads by
# eighths of it, so one map can breathe rather than blink. A period of zero
# leaves every door shut.
door_period = 600
door_open = 400

# A wormhole.
#
# The pull falls off as the square of the distance, so `wormhole_pull` is the
# pull one tile from the center rather than at the mouth: an inverse square law
# has no value at the middle of the well, and quoting it somewhere real is what
# gives the number a meaning. At n tiles it is the pull over n squared, so a
# well is close to nothing across most of its reach and overwhelming in the
# last few tiles. Closer in than one tile it stops climbing.
#
# 2000 is ours, and it is not the original's. Theirs is 5859: `gravity * 1000`
# over the distance squared, at the Gravity of 1500 every ship in the Alpha Zone
# settings carries, comes to that one tile out. That is a number for a 1024-tile
# map. On a 160-tile one it put the point of no return, the distance inside
# which a hull at rest cannot pull away on held thrust, at seventeen to
# twenty-one tiles of a 38-tile field, so half the reach was decided for the
# pilot rather than being somewhere to fly. At 2000 the radius is ten to twelve
# tiles and the rest of the field is a current to correct for. Five seconds of
# ignoring a well at the rim costs a hull 69 px/s toward it rather than 202,
# against a top speed near 305.
#
# How many wormhole tiles a map lays at one spot is the other term in this, and
# the one to watch when tuning: coincident tiles sum, so a core of n of them
# pulls n times as hard and pushes the point of no return out by the root of n.
#
# `wormhole_range` is a hard edge and is set here rather than derived from the
# strength. The original ties the two together, so it cannot have a well that
# is strong and small; 76 tiles is where its field ends at that Gravity, and
# that reach was drawn for a 1024-tile map. A 160-tile room sits almost
# entirely inside one well at that width, so this is half of it: 38 tiles,
# 608 px, close enough to the mouth to be a landmark rather than the weather.
wormhole_pull = 2000
wormhole_range = 608

# What a well adds to a hull's ceiling while it has hold of it, in px/s/10.
#
# This is what makes a wormhole throw a ship rather than only aim one. Without
# it the speed clamp takes back every pixel a second the pull just handed over,
# so a pilot falling into a well arrives at exactly the speed they could have
# flown there under thrust, and the well is a steering hazard and nothing more.
#
# Added to the ceiling rather than replacing it, so zero is no extra speed and
# not a hull pinned to a crawl. Small on purpose: it applies anywhere inside the
# field, and the field is wide, so a large number here is a speed bonus for
# standing near a landmark rather than the kick of being thrown by one. 100 is
# the original's.
wormhole_top_speed = 100

# GravityBombs: whether a well pulls thrown rounds as well as hulls.
#
# A round counts as thrown when it has a blast, which is the same test this
# core uses everywhere else it has to tell a bomb from a bullet. So bombs bend
# across a well and bullets cross it straight, and lobbing past one becomes a
# shot with an arc the map decides.
gravity_bombs = true

# The clock, for `mode = "melee"` and ignored by every other mode. A room that
# has one plays a match, puts up a podium, and plays another; a room without
# one runs until nobody is in it.
#
# match_seconds = 180
# intermission_seconds = 15

# A streak: kills without dying. Reaching it tells the room, marks the hull
# gold, and holds until somebody takes them. Set `streak_kills = 0` for a zone
# that wants none of it.
#
# The one thing this game says about how a pilot is doing right now. There were
# two more, and they were the same number twice: a bounty priced a kill and
# points banked it. Both went with the shop.
streak_kills = 3

# Connection diagnostics come from selective receipt windows. They describe
# round trip, jitter and snapshot delivery, but never restrict gameplay. The
# arena releases stale controls after one second without an input packet and
# moves the pilot to the stands after the longer silence below.
[arena.lag]
sample_ticks = 500
input_sample_ticks = 50
combat_idle_ticks = 500
spectate_silence_ticks = 500

# Per hull: a flight row, which is the whole of what a hull is. Anything left
# out keeps the shipped roster's.
#
# There is no weapon here and no build. Both used to be, a ladder and a profile
# a hull, and a hull that decides what a pilot carries is a hull deciding what
# they fly: a Cipher that could not be given a bomb rack was a body choosing a
# loadout. The weapons belong to the arena now, tuned by name below, and what a
# pilot carries is theirs, bought with seven credits.
#
# What a zone cannot override is the footprint. Every collision rectangle
# occupies exactly 625 square pixels and the client art is fitted around it.
#
# Flight is in the file's own units: px/s/10, tenths of the documented thrust
# unit, 400 to a full turn a second, energy, and energy a second times ten.
# Flat, because nobody upgrades one.
#
# [[arena.ships]]
# name = "Facet"
# speed = 3050
# thrust = 175
# rotation = 265
# energy = 1400
# recharge = 1100

# Weapons, by name.
#
# The core keeps two tables -- what a trigger makes, and what one projectile
# of it is -- and everything that leaves a ship is a row in each. A block here
# is one of each, under a name.
#
# The baseline builds one gun and one bomb for the whole room, named `gun` and
# `bomb`. A block whose name is one of those tunes that weapon and leaves the
# rest of it alone, for everybody: there is no per-hull weapon to tune, since a
# hull is how it flies. Any other name makes a new weapon, which another weapon
# can splinter into or a charge slot can hold.
#
# The weapons that belong to a slot in the settings rather than to a trigger
# are named for what they are: `repel` and `burst` for the two charges the
# baseline fills, `charge-3` and `charge-4` for the slots it leaves empty, and
# shrapnel-1 up, one per rung of the add-on. So the repel's own radius is
# `repel`'s blast, and what a second rung of shrapnel breaks into is
# shrapnel-2. Naming an empty charge slot makes the weapon and fills the slot
# at once.
#
# Units are the file's: px, px/s/10, energy, ticks, and degrees.
#
#   speed life on_wall bounces    how it flies (end, bounce, pass)
#   trigger expire_ends splinter    what counts as arriving somewhere
#   damage blast push push_time stall    what happens there
#   count spread energy delay recoil    what one pull of the trigger makes
#
# Three examples, all off. Uncomment one and save; the zone re-reads it and
# every client in the room gets the new table without reconnecting.
#
# A ladder is named by rung: `bomb` is the first, `bomb-2` and `bomb-3` the two
# a pilot's credits climb to, and tuning one leaves the others alone.
#
# Bombs that bounce three times, at every level:
#   [[arena.weapons]]
#   name = "bomb"
#   on_wall = "bounce"
#   bounces = 3
#
# A bomb that breaks into eight fragments where it goes off:
#   [[arena.weapons]]
#   name = "bomb"
#   splinter = "shrapnel"
#
#   [[arena.weapons]]
#   name = "shrapnel"
#   speed = 1200
#   life = 40
#   damage = 50
#   count = 8
#   spread = 45
#
# A repel: no damage at all, a wide shove, and gone on the tick it appears.
# This is the charge in the first slot, so tuning it retunes what every Q press
# in the room throws.
#   [[arena.weapons]]
#   name = "repel"
#   speed = 0
#   life = 1
#   on_wall = "pass"
#   expire_ends = true
#   blast = 300
#   push = 3000
#   energy = 400
#   delay = 300
#
# The baseline's own repel comes straight off the original's numbers:
# RepelDistance 512, RepelSpeed 5000 and RepelTime 225. The reach is a square
# of that half-width, the shove sets a hostile ship's speed to exactly that
# from anywhere inside it rather than falling off with range, and the time is
# how long it may fly at it before its own ceiling takes over -- which is the
# part that makes a repel a repel, since 5000 is half again the fastest hull.
#   [[arena.weapons]]
#   name = "repel"
#   blast = 300
#   push_time = 100
#
# A third charge, in a slot the baseline leaves empty. Naming it makes the
# weapon and fills the slot at once, and every pilot in the room may then spend
# a credit on it. Two kinds is what a keyboard has room for, so a third fills
# no key until one of the two above it is emptied.
#   [[arena.weapons]]
#   name = "charge-3"
#   speed = 0
#   life = 1
#   on_wall = "pass"
#   expire_ends = true
#   blast = 400
#   damage = 900
#   delay = 200

# The build space.
#
# A build is seven upgrades a pilot chooses, dealt to whatever hull they are
# sitting in at every spawn, and every slot in it costs exactly one. A slot is
# a stat step, a rung of a trigger's ladder, an add-on on a trigger, or a
# charge carried. Levels climb the ladders above; add-ons are transforms
# applied to whatever rung the trigger is on (multi, bounce, prox, shrapnel,
# freeze, push). What a build may hold is one row of ceilings for the whole
# arena, in `fill_slot_caps`: a ceiling a hull would be the hull choosing the
# loadout again.
#
# What one rung of each add-on is worth. Units are the field it moves:
# barrels, walls, px of fuse, ticks of stall, px/s/10 of shove.
#   [arena.mod_step]
#   multi = 2
#   bounce = 1
#   prox = 24
#   freeze = 100
#   push = 1200
#
# A rung of bouncing adds a wall to whatever the weapon already had, and both
# the gun and the bomb start at zero, so one rung is one wall on either. A
# bullet used to start at 255, more than its life can spend, which made that
# one credit a corridor where every miss kept hunting. Raising this number
# lengthens every ricochet in the room.
#
# What a rung of multifire adds to the cost of pulling the trigger, as a
# percentage of the shot's own energy and cooldown, and the degrees it fans to
# when the pattern it transforms has no spread of its own. The defaults are the
# original's -- 20 energy a bullet against 30 for multifire, 25 ticks of
# cooldown against 50 -- so three rounds cost half again the energy and twice
# the wait. Most of the price is in the rate, which is the half a pilot cannot
# out-recharge.
#   [arena]
#   multi_energy = 50
#   multi_delay = 100
#   mod_spread = 15
#
# The bomb rules the original spells out and this core follows. A proximity
# fuse widens with the bomb carrying it -- ProximityDistance is the level-one
# radius and each level adds a tile -- so prox under mod_step is the first and
# prox_step is what a level adds. And a fragment does almost nothing while it
# is still inside the hull the bomb went off against, which is what stops a
# bomb landing twice at point blank: once as the blast, again as a ring of
# shrapnel born already touching its victim.
#   [arena]
#   prox_step = 16
#   shrap_inactive = 3
#   shrap_inactive_ticks = 25
#
# What each rung of shrapnel breaks into is a weapon like any other, named for
# the rung. The baseline is the original's ShrapnelRate of 2 up to its
# ShrapnelMax of 8, scattered rather than fanned because Shrapnel:Random is on
# -- which a spread of zero is how a pattern asks for.
#   [[arena.weapons]]
#   name = "shrapnel-3"
#   count = 12
#   damage = 250
#
# A charge is a weapon you carry a count of and spend, and the count is a build
# slot: one key per charge, so a zone can fill an empty slot without asking for
# a key. The baseline fills two of the four, a repel and a burst.
#
# Nothing here decides what a pilot ends up flying. That is theirs: a build is
# chosen in the hangar inside the arena's ceilings, and seven credits is seven
# credits for a new account and a veteran alike.

# Staff and their capabilities are not here. Authority is still a set of named
# powers rather than a rank, the way ASSS did it, but it belongs to the
# deployment rather than to one game: the table lives in catalog.toml and the
# admin surface checks against it. See docs/architecture/catalog.md.
