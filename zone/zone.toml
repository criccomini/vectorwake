# A vectorwake zone.
#
# Everything an operator tunes lives here rather than in the server's source,
# which is the claim behind zones-are-content in docs/architecture. Anything
# left out keeps the value the simulation core ships with, so a short file is
# a legal file.
#
# The server re-reads this while running. Save it and the numbers change; no
# restart, nobody disconnected. A broken edit is logged and ignored rather
# than taking the zone down.

name = "first light"
description = "the reference zone: four flags, eight hulls, nine pilots"
listen = "127.0.0.1:9010"

# TLS. Set both and the zone serves wss instead of ws. A page delivered
# over https may only open wss -- browsers refuse a plain ws socket from
# a secure origin, with loopback the one exception -- so a zone that
# strangers reach from a hosted client needs these.
tls_cert = ""
tls_key = ""
max_players = 16

# Names here cannot join. Root-level keys must sit above every [table]:
# written below one, TOML reads them as belonging to that table instead,
# which the server now reports rather than ignoring.
bans = []

[arena]
mode = "warzone"
flags = 4

# Walls are inelastic. bounce is the speed a hit gives back out of 16, and
# friction is the speed retained along the wall. 16 and 16 would be lossless.
bounce = 10
friction = 14

respawn_delay = 300   # ticks, so three seconds
prize_delay = 100     # a green every second until the map is full
prize_max = 20

# Per-hull tuning, in settings-file units. Name the hull and set only what
# you want to change; upgrades climb toward whatever ceiling you give.
[[arena.ships]]
name = "Apex"
speed = 4900
thrust = 30
rotation = 420
energy = 1350
recharge = 1500

[[arena.ships]]
name = "Anvil"
speed = 3200
thrust = 14
rotation = 240
energy = 2600
recharge = 1000

# Weapons, by name.
#
# The core keeps two tables -- what a trigger makes, and what one projectile
# of it is -- and everything that leaves a ship is a row in each. A block here
# is one of each, under a name.
#
# The baseline builds a gun and a bomb for every hull, named for it:
# apex-gun, apex-bomb, wedge-gun, ... A block whose name is one of those tunes
# that weapon and leaves the rest of it alone. Any other name makes a new
# weapon, which a hull can carry or another weapon can splinter into.
#
# Units are the file's: px, px/s/10, energy, ticks, and degrees.
#
#   speed life on_wall bounces      how it flies (end, bounce, pass)
#   trigger expire_ends splinter    what counts as arriving somewhere
#   damage blast push stall         what happens there
#   count spread energy delay recoil    what one pull of the trigger makes
#
# Three examples, all off. Uncomment one and save; the zone re-reads it and
# every client in the room gets the new table without reconnecting.
#
# A hull's ladder is named by rung: anvil-bomb is the first, anvil-bomb-2 and
# anvil-bomb-3 the ones a bomb-level green climbs to.
#
# Bombs that bounce three times, at every level:
#   [[arena.weapons]]
#   name = "anvil-bomb"
#   on_wall = "bounce"
#   bounces = 3
#
# A bomb that breaks into eight fragments where it goes off:
#   [[arena.weapons]]
#   name = "anvil-bomb"
#   splinter = "shrapnel"
#
#   [[arena.weapons]]
#   name = "shrapnel"
#   speed = 1200
#   life = 40
#   damage = 50
#   count = 8
#   spread = 45
#
# A repel: no damage at all, a wide shove, and gone on the tick it appears.
# Give it to a hull with `bomb = "repel"` under [[arena.ships]]; `bomb = ""`
# takes a rack away again.
#   [[arena.weapons]]
#   name = "repel"
#   speed = 0
#   life = 1
#   on_wall = "pass"
#   expire_ends = true
#   blast = 300
#   push = 3000
#   energy = 400
#   delay = 300

# The tech tree.
#
# A green is a stat step, a weapon level, or an add-on. Levels climb the
# ladders above; add-ons are transforms applied to whatever rung the trigger is
# on -- multi, bounce, prox, shrapnel, freeze, repel -- and each hull's row
# says which it may ever hold and how many rungs of each. That is what keeps
# the roster a roster: shrapnel belongs to bombers however the greens fall.
#
# What one rung of each add-on is worth. Units are the field it moves:
# barrels, walls, px of fuse, ticks of stall, px/s/10 of shove.
#   [arena.mod_step]
#   multi = 2
#   bounce = 1
#   prox = 24
#   freeze = 100
#   push = 1200
#
# And who may hold what, under a ship:
#   [[arena.ships]]
#   name = "Anvil"
#   bomb_mods = { shrapnel = 3, prox = 1 }
#   gun_mods = { multi = 1 }

# Authority is a set of named powers rather than a rank, the way ASSS did it.
[[staff]]
name = "chris"
capabilities = ["ban", "setmode", "reload"]

