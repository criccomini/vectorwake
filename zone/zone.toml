# A vectorwake zone.
#
# Everything an operator tunes lives here rather than in the server's source,
# which is the claim behind zones-are-content in docs/architecture. Anything
# left out keeps the value the simulation core ships with, so a short file is
# a legal file -- and a key left out is different from a key set to zero,
# which is why `bounce = 0` is a wall that gives nothing back rather than a
# wall that means "use the default".
#
# The server re-reads this while running. Save it and the numbers change; no
# restart, nobody disconnected. A broken edit is logged and ignored rather
# than taking the zone down. The two exceptions are `mode` and `flags`, which
# settle when the arena opens: changing what a round is for while one is being
# played is not a tuning change.

name = "first light"
description = "the reference zone: four flags and seven hulls"
listen = "127.0.0.1:9010"

# TLS. Set both and the zone serves wss instead of ws. A page delivered
# over https may only open wss -- browsers refuse a plain ws socket from
# a secure origin, with loopback the one exception -- so a zone that
# strangers reach from a hosted client needs these.
tls_cert = ""
tls_key = ""
# Humans this zone admits. The room may hold more seats than this: max_ships
# under [arena] sizes the room and this bounds how many of its seats people get,
# which is what leaves the bot roster somewhere to sit.
max_players = 16

# Names here cannot join. Root-level keys must sit above every [table]:
# written below one, TOML reads them as belonging to that table instead,
# which the server now reports rather than ignoring.
bans = []

[arena]
mode = "warzone"
flags = 4

# Walls are inelastic. bounce is the speed a hit gives back out of 16, and
# friction is the speed retained along the wall. 16 and 16 would be lossless.
bounce = 10
friction = 14

# Pilots the room holds at once, bots included. 255 is the ceiling and not a
# preference: a ship index is one byte everywhere it appears, and 255 is already
# the "no ship" value in those fields. Leaving this out keeps 64, which is
# four times what the original aimed a public room at -- its DesiredPlaying
# defaults to 15 and exists only to decide when to open another arena. Widening
# is cheap (50 us a tick at the ceiling against 13.5 at 64) so the reason to
# stay near 64 is how the game plays, not what it costs.
max_ships = 64

respawn_delay = 400   # ticks, so four seconds

# How precisely a ship lands on the map's spawn point for its side.
#
# Zero, the default, puts it exactly on the tile. Above zero it lands on a
# random tile within that many of the point instead, redrawn on every death.
# The point is chosen first either way, so the map still decides which part of
# it a side comes back to.
#
# Exactly on the tile stacks a roster: a point is one tile, and a room with more
# ships than the map has points puts several of them on the same one with
# nothing between them. Size the radius by the crowd it has to spread, measured
# as seconds of bullet flight to the nearest enemy rather than in tiles. Alpha
# runs 60 for a bit over three seconds at the 51 ships one of its rooms holds;
# the numbers behind that are written out in catalog/zones/alpha/zone.toml.
#
# A map that names no spawn points has nothing to aim at, and there a radius
# scatters about the center of the map, which is what the original did before it
# had spawn points at all.
#
# spawn_radius = 60

# Whether a client marks the map's spawn tiles. Worth turning off in a mode that
# does not want one side's home end advertised to the other: the mark is drawn
# for every spawn on the map, the enemy's included and in the enemy's color.
#
# show_spawns = true

# Flags: how close a ship takes one from, and how long a dropped one is
# untouchable so a carrier cannot juggle their own.
flag_radius = 18
flag_drop_cooldown = 200

# Doors breathe. A cycle is open then shut, and a door's variant leads by
# eighths of it, so one map can breathe rather than blink. A period of zero
# leaves every door shut.
door_period = 600
door_open = 400

# A wormhole's pull at the mouth, in px/s/10, and the px beyond which it does
# not reach. One reaches fourteen tiles, which is enough to change how a whole
# room is flown -- see the note in the map's own source.
wormhole_pull = 90
wormhole_range = 220

# The clock, for `mode = "melee"` and ignored by every other mode. A room that
# has one plays a match, puts up a podium, and plays another; a room without
# one runs until nobody is in it.
#
# match_seconds = 180
# intermission_seconds = 25

# What a kill is worth. A killer is paid the victim's whole bounty, and a
# bounty is `bounty_base` plus `bounty_per_kill` for every kill since that
# pilot last died. So the number over a ship is the length of its current run
# and nothing else: it says nothing about what the pilot owns, and a fresh
# spawn is worth `bounty_base` whatever they are flying. Camping is priced by
# that arithmetic rather than by a rule about farming.
#
# points_per_flag is the bonus for each flag the victim was holding. See
# docs/design/bounty.md.
bounty_base = 1
bounty_per_kill = 3
points_per_flag = 100

# Connection diagnostics come from selective receipt windows. They describe
# round trip, jitter and snapshot delivery, but never restrict gameplay. The
# arena releases stale controls after one second without an input packet and
# moves the pilot to the stands after the longer silence below.
[arena.lag]
sample_ticks = 500
input_sample_ticks = 50
combat_idle_ticks = 500
spectate_silence_ticks = 500

# Per-hull tuning. Name the hull and set only what you want to change, which
# is a footprint and a ladder and nothing else.
#
# A hull used to carry flight as well: a ceiling, a floor and a step for each
# of five stats, so a zone could make one ship faster than another. That is
# gone, and so is the tech tree that sat beside it. Thirty points has to buy
# the same ship whatever you are flying or a kit is not a fair trade, and an
# add-on ceiling that lives on a hull is an upgrade the shop can never sell.
# See docs/design/ships.md.
#
# What is left is the shape. The defaults are measured off the drawn ships and
# the collision box follows the heading, so a Cipher is genuinely a thin target
# from the side; a zone that overrides `fore`, `aft` or `width` should keep
# sqrt(fore^2 + (width/2)^2) inside 23 px, the diagonal every shipped map was
# checked against.
#
# [[arena.ships]]
# name = "Apex"
# fore = 20

# What a kit may hold here, over the flat slot space, for every hull alike.
# Anything left out keeps the baseline's, which is the union of what the seven
# hull rows used to allow. An add-on left out of a map that names any is a slot
# this arena does not have.
#
# [arena.kit]
# gun_mods = { multi = 2, bounce = 1, freeze = 1, barrel = 2 }
# bomb_mods = { prox = 1, shrapnel = 3, bounce = 2, push = 2 }
# charges = [3, 3, 6]

# Weapons, by name.
#
# The core keeps two tables -- what a trigger makes, and what one projectile
# of it is -- and everything that leaves a ship is a row in each. A block here
# is one of each, under a name.
#
# The baseline builds a gun and a bomb for every hull, named for it:
# apex-gun, apex-bomb, wedge-gun, ... A block whose name is one of those tunes
# that weapon and leaves the rest of it alone. Any other name makes a new
# weapon, which a hull can carry or another weapon can splinter into.
#
# The weapons that belong to a slot in the settings rather than to a hull are
# named for what they are: `repel`, `burst` and `mine` for the three charges
# the baseline fills, `charge-4` for the slot it leaves empty, and shrapnel-1
# up, one per rung of the add-on. So the repel's own radius is `repel`'s
# blast, and what a second rung of shrapnel breaks into is shrapnel-2. Naming
# the empty charge slot makes the weapon and fills the slot at once.
#
# Units are the file's: px, px/s/10, energy, ticks, and degrees.
#
#   speed life on_wall bounces still    how it flies (end, bounce, pass)
#   trigger expire_ends splinter    what counts as arriving somewhere
#   damage blast blast_up push push_time stall    what happens there
#   count spread energy delay recoil    what one pull of the trigger makes
#
# `still` is the odd one and it is what a mine is made of. Every round takes
# the firer's velocity on top of its own speed, which is why a shot fired at a
# run is faster over the ground; a speed-zero round with that added leaves at
# exactly the speed the ship was doing and never stops. `still = true` is a
# round that stays where it was let go.
#
# Three examples, all off. Uncomment one and save; the zone re-reads it and
# every client in the room gets the new table without reconnecting.
#
# A hull's ladder is named by rung: anvil-bomb is the first, anvil-bomb-2 and
# anvil-bomb-3 the ones a kit's bomb rungs climb to. A ship block can write
# that ladder out (`gun = ["spike", "spike-2"]`) and `bomb = []` takes a rack
# away.
#
# Bombs that bounce three times, at every level:
#   [[arena.weapons]]
#   name = "anvil-bomb"
#   on_wall = "bounce"
#   bounces = 3
#
# A bomb that breaks into eight fragments where it goes off:
#   [[arena.weapons]]
#   name = "anvil-bomb"
#   splinter = "shrapnel"
#
#   [[arena.weapons]]
#   name = "shrapnel"
#   speed = 1200
#   life = 40
#   damage = 50
#   count = 8
#   spread = 45
#
# A repel: no damage at all, a wide shove, and gone on the tick it appears.
# Give it to a hull with `bomb = ["repel"]` under [[arena.ships]]; `bomb = []`
# takes a rack away again.
#   [[arena.weapons]]
#   name = "repel"
#   speed = 0
#   life = 1
#   on_wall = "pass"
#   expire_ends = true
#   blast = 300
#   push = 3000
#   energy = 400
#   delay = 300
#
# The baseline's own repel comes straight off the original's numbers:
# RepelDistance 512, RepelSpeed 5000 and RepelTime 225. The reach is a square
# of that half-width, the shove sets a hostile ship's speed to exactly that
# from anywhere inside it rather than falling off with range, and the time is
# how long it may fly at it before its own ceiling takes over -- which is the
# part that makes a repel a repel, since 5000 is half again the fastest hull.
#   [[arena.weapons]]
#   name = "repel"
#   blast = 300
#   push_time = 100
#
# A fourth charge, in the slot the baseline leaves empty. Naming it makes the
# weapon and fills the slot; give it a count under each hull that may carry
# it, which is what lets a kit slot one.
#   [[arena.weapons]]
#   name = "charge-4"
#   speed = 0
#   life = 1
#   on_wall = "pass"
#   expire_ends = true
#   blast = 400
#   damage = 900
#   delay = 200
#
#   [[arena.ships]]
#   name = "Anvil"
#   charges = [3, 3, 3, 2]
#
# A mine is a charge like any other: a count you carry and spend, laid where
# you are rather than thrown. What a zone decides is how long one sits there,
# which is a map setting as much as a weapon one, and how many each hull may
# slot.
#   [[arena.weapons]]
#   name = "mine"
#   life = 3000
#   blast = 120
#
#   [[arena.ships]]
#   name = "Anvil"
#   charges = [3, 3, 8]

# The kit space.
#
# A kit is thirty upgrades a pilot chooses and owns, dealt to the hull at every
# spawn, and every slot in it costs exactly one. A slot is a stat step, a rung
# of a trigger's ladder, an add-on on a trigger, or a charge carried. Levels
# climb the ladders above; add-ons are transforms applied to whatever rung the
# trigger is on (multi, bounce, prox, shrapnel, freeze, push) and each hull's
# row says which it may ever hold and how many rungs of each. That is what
# keeps the roster a roster: shrapnel belongs to bombers, and nothing a pilot
# can buy changes it. See docs/design/match-game.md.
#
# What one rung of each add-on is worth. Units are the field it moves:
# barrels, walls, px of fuse, ticks of stall, px/s/10 of shove.
#   [arena.mod_step]
#   multi = 2
#   bounce = 1
#   prox = 24
#   freeze = 100
#   push = 1200
#
# A rung of bouncing adds a wall to whatever the weapon already had, and what
# it already had is where bullets and bombs part company. A bullet starts at
# 255, more than its life can spend, so one rung means "until the round runs
# out"; a bomb starts at zero, so one rung means one wall. That is the
# original: BombBounceCount is a per-ship setting and no bullet equivalent
# exists, because a bouncing bullet is a weapon type there and not a budget.
# Raising this number lengthens bomb ricochets and does nothing to bullets,
# which are already saturated.
#
# What a rung of multifire adds to the cost of pulling the trigger, as a
# percentage of the shot's own energy and cooldown, and the degrees it fans to
# when the pattern it transforms has no spread of its own. The defaults are the
# original's -- 20 energy a bullet against 30 for multifire, 25 ticks of
# cooldown against 50 -- so three rounds cost half again the energy and twice
# the wait. Most of the price is in the rate, which is the half a pilot cannot
# out-recharge.
#   [arena]
#   multi_energy = 50
#   multi_delay = 100
#   mod_spread = 15
#
# The bomb rules the original spells out and this core follows. A proximity
# fuse widens with the bomb carrying it -- ProximityDistance is the level-one
# radius and each level adds a tile -- so prox under mod_step is the first and
# prox_step is what a level adds. And a fragment does almost nothing while it
# is still inside the hull the bomb went off against, which is what stops a
# bomb landing twice at point blank: once as the blast, again as a ring of
# shrapnel born already touching its victim.
#   [arena]
#   prox_step = 16
#   shrap_inactive = 3
#   shrap_inactive_ticks = 25
#
# What each rung of shrapnel breaks into is a weapon like any other, named for
# the rung. The baseline is the original's ShrapnelRate of 2 up to its
# ShrapnelMax of 8, scattered rather than fanned because Shrapnel:Random is on
# -- which a spread of zero is how a pattern asks for.
#   [[arena.weapons]]
#   name = "shrapnel-3"
#   count = 12
#   damage = 250
#
# And who may hold what, under a ship:
#   [[arena.ships]]
#   name = "Anvil"
#   bomb_mods = { shrapnel = 3, prox = 1 }
#   gun_mods = { multi = 1 }
#
# A charge is a weapon you carry a count of and spend, and the count is a kit
# slot: one key per charge, so a zone can fill the fourth slot without asking
# for a key. The baseline fills three of the four -- a repel, a burst and a
# mine -- and what each hull may slot is the `charges` row under it.
#
# Nothing here decides what a pilot ends up flying. That is theirs: a kit is
# chosen in the hangar out of what their account owns, inside the ceilings
# every hull's row above sets, and thirty points is thirty points for a new
# account and a veteran alike.

# Staff and their capabilities are not here. Authority is still a set of named
# powers rather than a rank, the way ASSS did it, but it belongs to the
# deployment rather than to one game: the table lives in catalog.toml and the
# admin surface checks against it. See docs/architecture/catalog.md.
