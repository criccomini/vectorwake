# The zone directory: what a player sees before they pick a game.
#
# A directory is not authoritative over anything. It holds no state worth
# losing, and a player who knows a zone's address can always connect straight
# to it without asking here first.
name = "vectorwake"

[[zone]]
address = "ws://127.0.0.1:9040"

[[zone]]
address = "ws://127.0.0.1:9041"
