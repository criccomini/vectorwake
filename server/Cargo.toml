[package]
name = "vectorwake-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# signal is for the arena's stop handler, which files every open session's
# departure in the pilot log before a converge replaces the container.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
# rustls-tls so a directory can poll a wss zone; without a TLS client
# feature connect_async refuses a wss address outright.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio-rustls = "0.26"
rustls-pemfile = "2"
ed25519-dalek = "2"
rand = "0.8"
# For the one credential a person chooses. Everything else the fleet stores is
# minted randomness and hashes as sha256; a password is guessable and gets the
# memory-hard treatment instead.
argon2 = "0.5"
sha2 = "0.10"
subtle = "2"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
base64 = "0.22"
tokio-postgres-rustls = "0.13"
rustls = "0.23"
webpki-roots = "0.26"
# The browser's other transport: QUIC datagrams and independent streams, so a
# lost packet no longer stalls every snapshot behind it. dangerous-configuration
# is for the integration test's client, which dials a self-signed endpoint.
# `quinn` is on for the transport config: the stream and flow-control limits
# a door needs are not on wtransport's own builder, which offers only the
# idle timeout and the keepalive.
wtransport = { version = "0.7.1", features = ["dangerous-configuration", "quinn"] }
# Finds the certificate wherever Caddy's ACME issuer of the day filed it.
glob = "0.3.4"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 2

[profile.test]
opt-level = 1
