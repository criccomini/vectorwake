[package]
name = "vectorwake-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
# rustls-tls so a directory can poll a wss zone; without a TLS client
# feature connect_async refuses a wss address outright.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio-rustls = "0.26"
rustls-pemfile = "2"
ed25519-dalek = "2"
rand = "0.8"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
base64 = "0.22"
tokio-postgres-rustls = "0.13"
rustls = "0.23"
webpki-roots = "0.26"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 2
