#cloud-config
# First boot for one vectorwake host. The work is in provision.sh, delivered
# here rather than cloned, because it has to run before there is a clone.
#
# Placeholders substituted before submission and never committed:
# __PROVISION_B64__ carries provision.sh, which itself carries __POOL_TOKEN__,
# __BRANCH__ and __DEPLOY_KEY_B64__. Those end up in the
# instance's user-data, readable by anything on the box through the metadata
# service. Acceptable because the box is what holds them anyway, and the reason
# they are generated per host rather than shared.

package_update: true
packages:
  - git
  - curl
  - ca-certificates

write_files:
  - path: /var/lib/vw-deploy/deploy/status
    content: "booted; provisioning has not started yet\n"
    permissions: "0644"
  - path: /usr/local/bin/vw-provision
    permissions: "0755"
    encoding: b64
    content: __PROVISION_B64__

runcmd:
  - [/usr/local/bin/vw-provision]
