<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The card the site, the client and every embed share.

       The background is the same frame the hero slot opens on, media/gameplay-poster.jpg,
       under the same two-gradient scrim the hero wears in site.css: heavy on the left where
       the words sit, nearly clear on the right where the arena should be legible, and dark
       along the bottom for the button and the URL. Anything that reads as the game beats
       anything drawn to represent it, and a share card that showed neither was the odd one
       out on a page whose whole first screen is footage.

       Referenced rather than embedded. The file sits beside this one and is served from the
       same directory, so `media/gameplay-poster.jpg` resolves both for the rasteriser and
       for anybody who opens the SVG at vectorwake.net/share-card.svg. Base64 would inline
       27 KB of noise into a file whose whole value is being readable. -->
  <defs>
    <linearGradient id="scrimx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05070c" stop-opacity=".96"/>
      <stop offset=".39" stop-color="#05070c" stop-opacity=".76"/>
      <stop offset=".76" stop-color="#05070c" stop-opacity=".08"/>
      <stop offset="1" stop-color="#05070c" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="scrimy" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070c" stop-opacity=".88"/>
      <stop offset=".32" stop-color="#05070c" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="628"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#05070c"/>
  <g clip-path="url(#frame)">
    <!-- 1280x720 into 1200x630: cover and centre, so the ship and its fan stay in
         frame rather than being letterboxed against the card's own black. -->
    <image href="media/gameplay-poster.jpg" xlink:href="media/gameplay-poster.jpg"
           x="0" y="0" width="1200" height="630"
           preserveAspectRatio="xMidYMid slice"/>
    <rect width="1200" height="630" fill="url(#scrimx)"/>
    <rect width="1200" height="630" fill="url(#scrimy)"/>
  </g>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#1d2838" stroke-width="2"/>

  <g transform="translate(72 62) scale(.55)" stroke-width="1.2" stroke-linejoin="miter">
    <path fill="#ffa552" stroke="#ffa552" d="M0 2h4l24 48h-4zM24.2 2h3.6v48h-3.6z"/>
    <path fill="#3f4b60" stroke="#3f4b60" d="M28 2h4l24 48h-4zM52.2 2h3.6v48h-3.6zM56 2h4l24 48h-4zM80.2 2h3.6v48h-3.6zM0 54h4l24 48h-4zM24.2 54h3.6v48h-3.6z"/>
    <path fill="#4fd6ff" stroke="#4fd6ff" d="M28 54h4l24 48h-4zM52.2 54h3.6v48h-3.6zM56 54h4l24 48h-4zM80.2 54h3.6v48h-3.6z"/>
  </g>
  <text x="132" y="102" fill="#dfe9f5" font-family="DejaVu Sans Mono, monospace" font-size="27" letter-spacing="2">vectorwake</text>

  <text x="72" y="268" fill="#dfe9f5" font-family="DejaVu Sans Mono, monospace" font-size="62" font-weight="700" letter-spacing="-2">MASSIVELY MULTIPLAYER</text>
  <text x="72" y="340" fill="#dfe9f5" font-family="DejaVu Sans Mono, monospace" font-size="62" font-weight="700" letter-spacing="-2">SPACE COMBAT.</text>
  <text x="75" y="404" fill="#9db0c9" font-family="DejaVu Sans Mono, monospace" font-size="25">Live in your browser. Free on desktop and mobile.</text>

  <!-- Bottom right, which is where a card's eye lands last and where the thing to
       press belongs. The URL takes the corner it left. -->
  <g transform="translate(896 496)" font-family="DejaVu Sans Mono, monospace" letter-spacing="1.5">
    <rect width="232" height="60" fill="#4fd6ff"/>
    <text x="116" y="39" fill="#02050a" font-size="19" font-weight="700" text-anchor="middle">PLAY FOR FREE</text>
  </g>
  <text x="72" y="545" fill="#7c8da6" font-family="DejaVu Sans Mono, monospace" font-size="16" letter-spacing="1.5">vectorwake.net</text>
</svg>
