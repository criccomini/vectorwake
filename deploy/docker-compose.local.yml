# Overlay for running the whole stack on one machine, before it goes anywhere.
#
#   printf 'VW_DOMAIN=localhost\nVW_POOL_TOKEN=...\nVW_ADMIN_TOKEN=...\n' > deploy/.env
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml \
#       --env-file deploy/.env up -d --build
#
# It does two things.
#
# **It builds instead of pulling.** The base file names a published image,
# because that is what a host should run: CI builds it once and every host pulls
# the same bytes. On a laptop the whole point is the code in front of you, which
# is not in any registry, so the build is put back here. `image:` still names the
# local tag so the two files cannot disagree about what is running.
#
# **It fixes name resolution.** Caddy routes by hostname, so the stack needs
# `play.<domain>` to resolve, and glibc does not resolve `*.localhost` however
# much it looks like it should. Without these entries the directory's address
# check fails, both arenas stay unverified, and the browse reply offers nothing
# while every game is in fact running -- a confusing enough symptom to be worth a
# file to prevent it.
#
# On a real host these are unnecessary: the names are in public DNS, and the
# directory's check reaches the public address the way a player would, which is
# the thing it is supposed to prove. Add `--resolve` or a hosts entry on whatever
# machine you test from too.
x-build: &build
  build:
    context: ..
    dockerfile: Dockerfile
  image: vectorwake:local

services:
  caddy:
    extra_hosts: &names
      - "play.${VW_DOMAIN}:127.0.0.1"
  directory:
    <<: *build
    extra_hosts: *names
  a1:
    <<: *build
    extra_hosts: *names
  a2:
    <<: *build
    extra_hosts: *names
  a3:
    <<: *build
    extra_hosts: *names
