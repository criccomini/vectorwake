# One host: a directory, three arena servers, and Caddy in front of all of it.
#
# More than one arena because that is what makes zone selection real rather than
# asserted. They read the same catalog and choose between themselves, so a fresh
# host comes up serving Chaos, War and Alpha without anybody assigning any of
# them.
#
# One per zone in the catalog, and that is the rule to keep: an arena picks a
# zone nobody is serving and then stays with it, so a fourth zone with three
# arenas is a zone in the browse list that no process ever takes.
#
# Host networking throughout, per docs/architecture/hosting.md: bridge mode
# publishes through NAT and a userland proxy, which hides the player's source
# address and puts every long-lived game connection through nf_conntrack. It
# also means these services reach each other on loopback, which is why the
# directory can bind 127.0.0.1 and still be registered with.
name: vectorwake

x-arena: &arena
  # Pulled, not built. The host compiled its own binary because the machine that
  # did the first deploy had no registry credential; CI has one, so a deploy is a
  # pull and this box needs no Rust toolchain, no C compiler, and none of the
  # 2 GB of swap that existed because cargo linking tokio and rustls was the peak
  # memory of its life.
  #
  # `prod` is a moving pointer CI retags on every push to main. Rollback is
  # retagging it at an older `sha-` and letting the updater converge, which beats
  # reverting a commit and rebuilding. Pin VW_IMAGE to a `sha-` tag to hold a
  # host at a known build.
  #
  # docker-compose.local.yml puts the build back for working on a laptop.
  image: ${VW_IMAGE:-ghcr.io/criccomini/vectorwake:prod}
  network_mode: host
  # Any exit restarts, including a clean one. That is what makes the admin
  # surface's `restart` verb work: the process exits 0 and the platform brings
  # it back, which is the honest implementation of a restart button.
  restart: unless-stopped
  # Least privilege, because these processes parse bytes from strangers. They
  # bind unprivileged ports, write nothing but their own volume, and never
  # escalate, so every capability is dropped and setuid is off the table. What
  # this bounds is the blast radius of a bug in the one C library in the stack:
  # a compromised arena on a host-network container is otherwise a process on
  # the host with root's capabilities.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  caddy:
    image: caddy:2-alpine
    network_mode: host
    restart: unless-stopped
    # Where the page comes from, as a label, because it is the one thing about
    # this service that has changed twice today and both times the symptom was a
    # 404 nobody could attribute.
    #
    # It also forces a recreate. Changing only the volume source, from a named
    # volume back to this bind mount, left compose reporting "Running" and
    # keeping a container still holding the empty volume -- so the page stayed
    # 404 through two converges. A label is part of the service config, so it
    # moves the config hash and compose acts. Recreating Caddy is safe now that
    # the certificates are on a block volume rather than in its container.
    labels:
      vw.page-source: image
      # The same trick again, for the same reason. Caddy reads its file once at
      # start and the file arrives through a bind mount, so editing it moves
      # nothing compose can see and a new route stays dark until something else
      # recreates the container. This label lists what the file routes, so
      # adding a route means changing it, and changing it is what makes compose
      # act. Keep it in step with the Caddyfile.
      vw.routes: dir meta a1 a2 a3
    security_opt:
      - no-new-privileges:true
    # Caddy is the one thing here that binds privileged ports, so it keeps
    # exactly that capability and nothing else.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Losing these means asking Let's
      # Encrypt for everything again, which is rate limited to five a week per
      # name -- and losing them is not hypothetical, it is what took the game
      # dark for an afternoon.
      #
      # So on a host this is a block volume, a resource a reinstall cannot take
      # away, and VW_CERT_DIR names its mount point. Compose reads a value
      # starting with a slash as a bind mount and anything else as a named
      # volume, so the default keeps a laptop on the throwaway volume it wants.
      - ${VW_CERT_DIR:-caddy-data}:/data
      - caddy-config:/config
      # Coarse provisioning progress, served over plain http by IP. The proxy
      # starts before the build so this is readable while the slow part runs.
      - ${VW_DEPLOY_LOG:-./deploy-log}:/srv/deploy:ro
      # The browser client, published into this volume by the `client` service
      # below. It still has to come from this origin: a page served by a third
      # party under `connect-src 'self'` cannot open a socket to these arenas.
      - client-page:/srv/play:ro
    environment:
      VW_DOMAIN: ${VW_DOMAIN:?set VW_DOMAIN}

  # The page, delivered rather than served. A payload image with no process: it
  # copies the bundle into the volume Caddy is already serving and exits, so a
  # client release never restarts Caddy. Recreating Caddy severs every WebSocket
  # it carries, which for a change to a menu label would mean disconnecting
  # everybody mid-match.
  #
  # Copy then rename, because `mv` inside one filesystem is atomic: a request
  # arriving mid-deploy gets the old file or the new one, never half of either.
  #
  # No depends_on, deliberately. Making Caddy wait for this to finish would mean
  # a failed one-second file copy holding the whole site down, when the volume
  # already holds a perfectly good previous page. Caddy serves the old bundle
  # until the new one lands, which is the behaviour worth having.
  client:
    image: ${VW_CLIENT_IMAGE:-ghcr.io/criccomini/vectorwake-client:prod}
    restart: "no"
    # It moves a file between two local paths. It has no business on a network.
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - client-page:/srv/play
    # Named literally, with no shell variables. Compose escapes `$` as `$$` and
    # `docker compose config` re-escapes on the way out, so a loop over /page/*
    # can be verified by reading neither the file nor the rendered output, and an
    # unverifiable deploy step is worse than a literal one.
    command:
      - /bin/sh
      - -c
      - cp -a /page/index.html /srv/play/.index.html.new
        && mv -f /srv/play/.index.html.new /srv/play/index.html
        && ls -l /srv/play/index.html

  directory:
    <<: *arena
    command: ["directory", "127.0.0.1:9000", "/catalog"]
    environment:
      # Loopback on purpose. The directory refuses a credential over cleartext
      # unless the peer is loopback, and behind a proxy every peer looks like
      # loopback -- so a public port here would be a pool token accepted in the
      # clear from anyone. Caddy terminates TLS and is the only way in.
      VW_ADMIN_LISTEN: 127.0.0.1:9100
      VW_ADMIN_TOKEN: ${VW_ADMIN_TOKEN:?set VW_ADMIN_TOKEN}

  # Accounts, ratings, and the rated event log. The one process here with a
  # database behind it, and the one every other process is built to survive the
  # loss of: arenas verify session tokens against a key the catalog carries, so
  # nothing on the join path calls this.
  #
  # `on-failure` rather than `unless-stopped`, alone in this file. A deployment
  # without accounts is a supported arrangement, and it is expressed by leaving
  # VW_META_DATABASE unset: the process says so and exits zero, and that is a
  # decision rather than a crash. A real crash exits non-zero and comes back.
  #
  # The database is bought rather than run, per decision 27. It is the only
  # thing in this system whose loss cannot be repaired by rebuilding, and a
  # container on a bind mount would quietly make this host unlosable.
  meta:
    <<: *arena
    restart: on-failure
    command: ["meta", "/catalog"]
    environment:
      VW_META_LISTEN: 127.0.0.1:9400
      # Empty means no accounts. See above.
      VW_META_DATABASE: ${VW_META_DATABASE:-}
      # 64 hex characters from `vectorwake-server metakey`, whose other half
      # goes in the catalog's [meta] block. Losing this invalidates every live
      # session and nothing else: minting a new one and publishing the new
      # verifying key costs everybody one login.
      VW_META_KEY: ${VW_META_KEY:-}
      # Fleet bans are applied here, because this is where tokens are minted.
      VW_ADMIN_TOKEN: ${VW_ADMIN_TOKEN:?set VW_ADMIN_TOKEN}

  a1:
    <<: *arena
    command: ["127.0.0.1:9001", "/var/lib/vectorwake"]
    environment:
      VW_DIRECTORY: ws://127.0.0.1:9000
      VW_TOKEN: ${VW_POOL_TOKEN:?set VW_POOL_TOKEN}
      # What the directory hands players, which is not what this process binds:
      # it serves cleartext on loopback and Caddy is the wss endpoint.
      # One hostname, a path per arena: see the Caddyfile for why.
      VW_ADDRESS: wss://play.${VW_DOMAIN}/a1
      VW_REGION: ${VW_REGION:-local}
      # Where rated events go. Loopback rather than the catalog's public
      # address, which is for clients.
      VW_META: http://127.0.0.1:9400
    volumes:
      - a1:/var/lib/vectorwake
    depends_on: [directory]

  a2:
    <<: *arena
    command: ["127.0.0.1:9002", "/var/lib/vectorwake"]
    environment:
      VW_DIRECTORY: ws://127.0.0.1:9000
      VW_TOKEN: ${VW_POOL_TOKEN:?set VW_POOL_TOKEN}
      VW_ADDRESS: wss://play.${VW_DOMAIN}/a2
      VW_REGION: ${VW_REGION:-local}
      VW_META: http://127.0.0.1:9400
    volumes:
      - a2:/var/lib/vectorwake
    depends_on: [directory]

  a3:
    <<: *arena
    command: ["127.0.0.1:9003", "/var/lib/vectorwake"]
    environment:
      VW_DIRECTORY: ws://127.0.0.1:9000
      VW_TOKEN: ${VW_POOL_TOKEN:?set VW_POOL_TOKEN}
      VW_ADDRESS: wss://play.${VW_DOMAIN}/a3
      VW_REGION: ${VW_REGION:-local}
      VW_META: http://127.0.0.1:9400
    volumes:
      - a3:/var/lib/vectorwake
    depends_on: [directory]

  # The population. One process flies every bot on this host: it asks each arena
  # how many it wants and opens that many connections, each an ordinary client
  # that decodes snapshots through the simulation core. See decision 29.
  #
  # Named directly rather than browsed, which is the one place this service
  # departs from the design in ai-runtime.md, and the reason is the addresses a
  # browse would return. An arena advertises `wss://play.<domain>/aN`, because
  # that is what a player must dial, so a bot server acting on a browse reply
  # would take every one of its connections out through DNS, TLS and Caddy to
  # come back to a port on the same machine. That is 150 proxied sockets and two
  # TLS stacks for traffic that never leaves the box.
  #
  # These are the same three arenas this file already declares, so it is not a
  # second source of truth about what is running; and asking an arena directly
  # is a better question anyway, since `bots_wanted` is the arena's own answer
  # whatever zone it happens to have taken. A second host runs its own copy of
  # this service against its own arenas, which is the deployment rule either way.
  #
  # No volume. It keeps nothing between runs, because a bot's career lives in
  # its account now rather than here.
  #
  # It does hold the pool token, which is new: a house bot claims an account
  # with it, one per roster individual, and flies on a real session token. That
  # is what lets one of them anchor the rating ladder and what tells a player
  # which bots are the fleet's own rather than somebody else's.
  #
  # No address of its own either, which is why it can be restarted at any time.
  # Losing it empties the rooms of bots and does nothing else; every human in
  # them keeps playing, and the crowd comes back within seconds of it returning.
  bots:
    <<: *arena
    command: ["bots"]
    environment:
      VW_ARENAS: ws://127.0.0.1:9001,ws://127.0.0.1:9002,ws://127.0.0.1:9003
      VW_META: http://127.0.0.1:9400
      VW_TOKEN: ${VW_POOL_TOKEN:?set VW_POOL_TOKEN}
    depends_on: [directory, a1, a2, a3, meta]

volumes:
  caddy-data:
  caddy-config:
  # What Caddy serves at /. Written by the `client` service, read by Caddy, and
  # the reason a client release is a pull rather than a restart.
  client-page:
  # Per arena, and the reason is the instance id: it is written on first start
  # and read on every one after, so an arena that loses this file comes back
  # looking like a different instance and the directory lists a ghost until the
  # old registration is reaped.
  a1:
  a2:
  a3:
