# Turf: four a side, six stands, and the match goes to whoever holds all six
# for fifteen seconds.
#
# A flag here is a place rather than an object. Nobody carries one: fly over a
# stand and it is yours, and it stays yours until somebody of another side
# crosses it. Six stands and four a side is the whole difficulty. Two more
# stands than either team has pilots means nobody can cover the map, so taking
# the set is a sweep the other side can see coming and has fifteen seconds to
# break.
#
# There is no clock on the match. It runs until somebody holds everything, and
# then the room stands the flags back up and deals another.

label = "Turf"

mode = "flags"

# Three maps, one theme apiece, each drawing six stands down its long axis.
# `mapforge verify` proves each is the exact output its recipe names.
maps = [
  "stanchion.vwmap",
  "gyre.vwmap",
  "holdfast.vwmap",
]

# Eight seats, four a side, the same shape Team Battle plays. A pilot who
# knows one game's room size knows the other's.
max_players = 8
max_ships = 8
bot_fill = 1.0
fill_target = 8
max_rooms = 10

teams = ["Keel", "Vantage"]
max_teams = 2
max_humans_per_team = 4
max_bots_per_team = 4

[arena]
# No `match_seconds`: a flag game has no length. Fifteen seconds of podium
# between two of them, which is where the sides are evened up and the ground
# changes.
intermission_seconds = 15

# The rule that makes this turf rather than Capture the Flag: a stand cannot
# be picked up.
flag_carry = false

# Two flag numbers matter here and neither is written, because both are
# already the baseline's. A stand settles for two seconds after changing hands
# (`flag_drop_cooldown`), without which two pilots of opposite sides sitting on
# one stand take it from each other a hundred times a second, the pennant
# strobes, and a side holding the set would win or not depending on which tick
# the fifteen seconds ran out on rather than on the fight. And a stand is
# claimed from eighteen pixels past the hull's own edge (`flag_radius`), which
# is the whole of how precisely you have to fly over one.

# Nothing else, and deliberately so. A pilot moving between this game and Team
# Battle should find the same ship, the same wall and the same economy; what
# differs is what the room is for. All of it is the baseline's, in
# `sim/src/baseline.c`, which is the one place any of it is written.
