# Capture the Flag: four a side over four flags, and the match belongs to
# whoever holds all of them for fifteen seconds.
#
# A flag can only be taken from a side that is not yours, it rides whoever took
# it, and it drops where they die. Gather the whole set, keep it for fifteen
# seconds, and the match is yours; the flags then go neutral and back on their
# stands, the ground changes, and the next one starts.
#
# There is no clock on the match. It runs until somebody holds the set, so the
# only thing worth counting is the fifteen seconds that decide it, and the
# other side losing one flag takes that away again.

# The key stays `war`, which is what a join, a rating and a room are filed
# under and what every rating already written is filed under. The label is the
# whole of what a player reads, and what they read is the game they know.
label = "Capture the Flag"

mode = "flags"

# Three maps, each drawing four stands. Two are the same theme at different
# proportions, which changes the geometry rather than the paint: a keep on a
# wide map is approached along its face and a keep on a tall one is approached
# down a corridor.
maps = [
  "rampart.vwmap",
  "bulwark.vwmap",
  "lattice.vwmap",
]

max_players = 8
max_ships = 8
bot_fill = 1.0
fill_target = 8
max_rooms = 10

teams = ["Keel", "Vantage"]
max_teams = 2
max_humans_per_team = 4
max_bots_per_team = 4

[arena]
# No `match_seconds`: gathering four carried flags against a side trying to
# take them back is not a thing with a length, and a clock that ended the
# match before either side ever completed the set ended it about nothing.
# Fifteen seconds of podium between two of them.
intermission_seconds = 15

# Thirty seconds is what one pilot may carry a flag for before it drops on its
# own, keeping their side. Home to home on these maps is about twelve seconds,
# so a carry is two crossings: long enough to bring a flag to where your side
# holds the others, short enough that the fastest hull in the room cannot take
# one out of the game by staying alive with it.
#
# Without a limit that is exactly what happens. The other side's only answer to
# a runner is to kill them, and a hull built to not be killed turns a four flag
# match into a three flag match nobody can finish.
flag_carry_seconds = 30

# The other two flag numbers are the baseline's and so are not written here: a
# dropped flag waits two seconds before it can be taken again, so the pilot who
# just killed a carrier does not sweep it up in the same pass, and a flag is
# taken from eighteen pixels past the hull's own edge.

# Nothing else: the ship, the wall and the economy are the baseline's, which is
# what every zone in this catalog plays. See `sim/src/baseline.c`.
