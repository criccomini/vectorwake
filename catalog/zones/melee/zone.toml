# Melee: four a side, three minutes, kills.
#
# The room outlives the match. It plays one, puts up a podium for twenty-five
# seconds, changes ground, and plays another, so a pilot who presses Play once
# never touches a menu again until they want to. docs/design/match-game.md is
# the argument for all of it.
#
# The tuning this game is played on came across from the open arena it
# replaced, where it was arrived at by playing rather than out of anybody's
# settings file. It is not in this file any more: the fleet plays one game and
# it is written once, in `sim/src/baseline.c`. What is here is the clock, the
# ground, and the room.

label = "Team Battle"

# The clock and the score are the mode's; kills are what it counts.
mode = "melee"

# Five maps, each from the recipe and metrics beside it. `mapforge verify`
# proves that a map is the exact output its recipe names.
#
# One theme apiece, and a theme owns its geometry rather than scattering a
# material over somebody else's topology: a pilot who has flown a room once
# knows it from the radar corner. Between them they use every element a melee
# map is allowed. Maelstrom and ringworks carry the only wormholes; gantry,
# warren, redoubt and ringworks the only doors.
maps = [
  "maelstrom.vwmap",
  "gantry.vwmap",
  "warren.vwmap",
  "redoubt.vwmap",
  "ringworks.vwmap",
]

# Eight seats, all eight of them a person's if eight people want them. The bot
# server holds every empty one and stands down the moment somebody arrives,
# which is what makes "press play and you are in a match" true at this
# population.
max_players = 8
max_ships = 8
bot_fill = 1.0

# A second room opens only when the first holds eight humans. That is the whole
# of the concentration rule, and at this population it means everybody who
# turns up is in the same match.
fill_target = 8

# Ten rooms to a process, which is a ceiling rather than a count: a room
# appears when every live one is full and is reclaimed when it empties.
max_rooms = 10

# Two sides, four each. Named for things that hold a structure up, which is the
# register the hulls are named in, and neither is a name any pilot wears.
teams = ["Pylon", "Caisson"]
# Two, so nobody founds a third side inside a game built for two.
max_teams = 2
max_humans_per_team = 4
max_bots_per_team = 4

[arena]
# Three minutes of play, fifteen seconds of podium. It was twenty-five, which
# is a long time to look at a result on an empty arena: the wait is for reading
# the podium and getting to the hangar, and both fit inside fifteen.
match_seconds = 180
intermission_seconds = 15

# No spawn radius, which is the baseline's answer and this game's too: a pilot
# arrives exactly on one of the map's own starts, because that is what a pocket
# is for. Four points a side and four ships a side, and `sim_restart` walks a
# side along its own starts, so every pilot opens a match on a tile of their
# own. The open arena scattered arrivals over sixty pixels, and had to: it put
# fifty-one ships on sixteen points and they landed on top of each other. Free
# Roam still does. Here a radius would only blur the one piece of geometry the
# whole design leans on.

# The ships, the weapons and the wall.
#
# None of them are here, and that is the arrangement rather than an omission.
# Seven hulls, one gun and one bomb of three rungs each, a repel and a burst, a
# wall that gives back three quarters of what hit it: all of it is in
# `sim/src/baseline.c`, which is what a zone starts from and what this zone
# plays unchanged. See docs/design/ships.md for what each hull is.
#
# This file used to restate about twenty of those numbers, and the other four
# zones restated the same twenty after it. Most were already the baseline's own
# value and the rest were this zone's tuning copied four times, so the catalog
# carried five chances to disagree about the wall and no way to notice. What a
# zone writes now is what makes it that zone.
#
# Overriding is still one block. A hull that flies differently here:
#
#   [[arena.ships]]
#   name = "Facet"
#   speed = 3050
#
# Nothing about a weapon is in that block. A hull is how it flies; the gun, the
# bomb and the two charges belong to the arena, and a pilot's seven credits say
# what they carry. A zone tunes a weapon by name under `[[arena.weapons]]` and
# the whole room gets it.
