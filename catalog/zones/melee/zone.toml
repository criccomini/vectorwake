# Melee: four a side, three minutes, kills.
#
# The room outlives the match. It plays one, puts up a podium for twenty-five
# seconds, changes ground, and plays another, so a pilot who presses Play once
# never touches a menu again until they want to. docs/design/match-game.md is
# the argument for all of it.
#
# The tuning below came across from the open arena this replaced, where it was
# arrived at by playing rather than out of anybody's settings file. What is new
# here is the clock, the two pockets, and the numbers that had to move because
# a match is three minutes rather than an evening.

label = "Team Battle"

# The clock and the score are the mode's; kills are what it counts.
mode = "melee"

# Five maps, each from the recipe and metrics beside it. `mapforge verify`
# proves that a map is the exact output its recipe names.
#
# One theme apiece, and a theme owns its geometry rather than scattering a
# material over somebody else's topology: a pilot who has flown a room once
# knows it from the radar corner. Between them they use every element a melee
# map is allowed. Maelstrom and ringworks carry the only wormholes; gantry,
# warren, redoubt and ringworks the only doors.
maps = [
  "maelstrom.vwmap",
  "gantry.vwmap",
  "warren.vwmap",
  "redoubt.vwmap",
  "ringworks.vwmap",
]

# Eight seats, all eight of them a person's if eight people want them. The bot
# server holds every empty one and stands down the moment somebody arrives,
# which is what makes "press play and you are in a match" true at this
# population.
max_players = 8
max_ships = 8
bot_fill = 1.0

# A second room opens only when the first holds eight humans. That is the whole
# of the concentration rule, and at this population it means everybody who
# turns up is in the same match.
fill_target = 8

# Ten rooms to a process, which is a ceiling rather than a count: a room
# appears when every live one is full and is reclaimed when it empties.
max_rooms = 10

# Two sides, four each. Named for things that hold a structure up, which is the
# register the hulls are named in, and neither is a name any pilot wears.
teams = ["Pylon", "Caisson"]
# Two, so nobody founds a third side inside a game built for two.
max_teams = 2
max_humans_per_team = 4
max_bots_per_team = 4

[arena]
# Three minutes of play, fifteen seconds of podium. It was twenty-five, which
# is a long time to look at a result on an empty arena: the wait is for reading
# the podium and getting to the hangar, and both fit inside fifteen.
match_seconds = 180
intermission_seconds = 15

# A wall gives back twelve sixteenths of what hit it. There is no separate term
# for speed along a wall, so both take the same number.
bounce = 12
friction = 12

# Two seconds dead. The open arena waited four, and four was fine there because
# the map was a thousand tiles wide and the wait was the smaller half of the
# penalty. Here the walk home is the penalty, described below, and four seconds
# of staring at a card is a fortieth of the match.
respawn_delay = 200

# Exactly on the map's own starts, which is what a pocket is for.
#
# The open arena scattered arrivals over sixty pixels because it put fifty-one
# ships on sixteen points and they landed on top of each other. Here there are
# four points a side and four ships a side, and `sim_restart` walks a side
# along its own starts, so every pilot opens a match on a tile of their own.
# A radius would only blur the one piece of geometry the whole design leans on.
spawn_radius = 0

# Neither map draws a safe zone, and neither should: a safe pocket is where a
# leading side goes to stall out a clock. The limit is set anyway, because a
# zone that later wants one should not also have to remember this line.
safe_limit = 3000

# Three kills without dying is a streak: the room is told, the hull goes gold,
# and somebody comes to end it. Left at the baseline's threshold.
#
# Two settings stood here, `bounty_base` and `bounty_per_kill`, and a third
# for flags. A kill paid the victim's bounty into a points total, and both
# numbers went with the shop they fed. What a kill moves now is the killer's
# own count and the room's score.
streak_kills = 3

# Five degrees between rounds. Between tunings this was the one setting that
# moved a lot: a 15-degree fan was worth +5 win points and a 5-degree one +29,
# because a fan nobody can land is not a weapon.
mod_spread = 5

# What one more round costs, as a percentage of the shot's own energy and
# cooldown.
#
# Fifty, which is the baseline's, and it was a hundred until spray stopped
# being something a pilot bought.
#
# The hundred was right for what it was written against. Spray was a rung on a
# shelf, and at twenty-five the two costs cancelled: a pull at spray three
# charged 1.75 times the energy over 1.75 times the cooldown, so the drain per
# second never moved and the rounds per second went up by 2.3. That is not a
# trade, it is a free upgrade nobody can decline, and the room played like it.
# A hundred made a rung buy the volley and never the rate: four rounds arriving
# together instead of spread over a second, at the same rounds a minute a bare
# barrel throws. Measured over forty matches on drydock it took the rounds in
# the air from 88 to 63, the deaths from 2.0 a pilot-minute to 1.3, and the
# roster's accuracy from the low thirties into the high forties.
#
# Nobody buys spray now. It is a number on a hull, so there is no rung to
# decline and no purchase to make dominant, and a hundred stopped being a price
# and became a tax on the three ships that have barrels. `calibrate hulls`
# under this tuning put every one of them in the bottom three and every
# single-round hull in the top three, in that order, on both rooms: the Facet
# fires a fifth as often for five rounds, which is the same rounds a minute as
# the Lattice spread into a fan that mostly misses, on a smaller pool, for
# nothing. Fifty is a trade again: five rounds is three times the wait and
# 2.25 times the energy for 1.67 times the rounds a minute.
multi_energy = 25
multi_delay = 50

# Three tiles of fuse, and a tile more for each rung of the bomb carrying it. A
# fuse that has found somebody waits `prox_delay` for them to start pulling
# away before it goes off anyway, and a proximity bomb will not leave the tube
# with an enemy already inside the fuse's distance, so it cannot be carried up
# to a hull and posted through it.
prox_step = 16
prox_delay = 150
bomb_safety = true
# A hull whose bombs bounce pays nothing for it.
bbomb_damage = 1000
# Three damage over the first quarter second, which is what stops a bomb landing
# twice at point blank.
shrap_inactive = 3
shrap_inactive_ticks = 25

[arena.mod_step]
# One rung of spray is one more round, and proximity is measured in pixels. A
# rung of bouncing is one more wall on top of what the weapon already had,
# which is one wall for a bomb and nothing worth counting for a bullet.
multi = 1
bounce = 1
prox = 48

# The damage of one of the twenty-four rounds a burst throws. Lower than the
# baseline's 700, so a burst is survivable at a range that one is not.
[[arena.weapons]]
name = "burst"
damage = 515

# The ships.
#
# There is no ships section, and the roster is the baseline's: seven hulls,
# each with its own flight row, its own gun and bomb, and its own profile. See
# docs/design/ships.md for what each one is and `sim/src/baseline.c` for the
# four tables it is written in.
#
# It is not repeated here on purpose. A zone that wrote the roster out would be
# a second copy of it to keep in step, and this zone plays the game as shipped.
# A block per hull is how a zone that wants a different ship says so:
#
#   [[arena.ships]]
#   name = "Facet"
#   speed = 3050
#   gun_mods = { multi = 4, bounce = 1 }
#   charges = [2, 0]
#
# Two blocks that used to live under this heading are gone with the shop. One
# was a flight row per hull, removed when a kit was thirty points and thirty
# points had to buy the same ship whatever you were sitting in; the other was
# `[arena.kit]`, which said what that kit could hold here. There is no kit, so
# the hulls have their engines back and there is no shelf left to describe.
