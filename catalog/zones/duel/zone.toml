# One life against one other pilot.
#
# Who that is comes from the door rather than from a roster: a person of about
# your rating where one is waiting, and a house pilot of about your rating
# where none is. The seat is held open for a person for ten seconds first, and
# a person arriving later takes it from the bot. What the board says is your
# streak and who you beat to get it.
#
# With nobody here two bots fly it anyway, so the play page has a fight to show
# whoever is deciding what to press. That is why both sides below take a bot as
# well as a person.

label = "Duel"
mode = "duel"

# The same five rooms Team Battle plays, so a pilot who learns a map learns it
# once. A duel is two ships in a room built for eight, which is the point: the
# room is bigger than the fight, and where the fight happens is a decision
# rather than a spawn.
#
# Gantry is also the calibration ground, and calibration flies it alone.
# Keeping the live arena and the measurement fixture aligned prevents a rating
# earned in open space from pretending to describe a close fight around walls,
# and holding the fixture to one map keeps a rating comparable from week to
# week while the room a player lands in varies.
maps = [
  "../melee/maelstrom.vwmap",
  "../melee/gantry.vwmap",
  "../melee/warren.vwmap",
  "../melee/redoubt.vwmap",
  "../melee/ringworks.vwmap",
]

max_players = 2
max_ships = 2
bot_fill = 1.0
fill_target = 1
max_rooms = 20

teams = ["Pilot", "Rival"]
max_teams = 2
max_humans_per_team = 1
max_bots_per_team = 1

# A guest is an account: the meta-layer mints one per device, and the rating a
# duel moves hangs off whatever account id is flying. Nobody has to claim a
# pilot before their first fight. A guest account is swept after a week away
# and its rating goes with it; claiming the pilot is what makes it permanent.
admission = "any"
max_watchers = 8

[arena]
match_seconds = 180
intermission_seconds = 8

# A duel is one life. Catalog validation refuses any other value for this mode.
duel_first_to = 1

# The same movement, collision, weapon, and kit economy used in melee. A duel
# should measure the pilot, not a private ruleset the player never sees in the
# main game.
#
# `a_duel_runs_the_melee_economy` holds every line below against melee's own,
# because this was prose and prose does not fail a build: melee's spray tuning
# moved and these did not, and for a while a duel was measuring a ruleset
# nobody played anywhere else.
bounce = 12
friction = 12
respawn_delay = 200
spawn_radius = 0
safe_limit = 3000
bounty_base = 1
bounty_per_kill = 1
points_per_flag = 0
mod_spread = 5
multi_energy = 25
multi_delay = 100
prox_step = 16
prox_delay = 150
bomb_safety = true
bbomb_damage = 1000
shrap_inactive = 3
shrap_inactive_ticks = 25

[arena.mod_step]
multi = 1
bounce = 1
prox = 48

[[arena.weapons]]
name = "burst"
damage = 515

[arena.kit]
gun_mods = { multi = 3, bounce = 1, freeze = 1 }
bomb_mods = { prox = 1, shrapnel = 3, bounce = 2, freeze = 1 }
charges = [3, 3]
