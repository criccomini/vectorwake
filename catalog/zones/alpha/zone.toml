# Alpha: two teams, six a side, kills only.
#
# The numbers here are not ours. They come from a settings file for the
# original's server, so this is a translation and reads like one: every value
# below names the key it came from. Where that file and our baseline disagree
# the file wins, and where the file says nothing the baseline stands. What it
# asked for that this core has no model of is listed at the bottom rather than
# dropped in silence.
#
# The name comes from the file too. Its [Misc] SheepMessage reads "Alpha Zone
# Map", which is the only place it ever says what it is.
#
# Hulls are ours and ships are theirs, so the per-ship lines needed a mapping.
# It is the one baseline.c already implies, drawn on what each hull is for:
#
#   Warbird    Apex      the interceptor
#   Javelin    Wedge     the flat fast bomber
#   Spider     Chord     the skirmisher
#   Leviathan  Anvil     the heavy, and the only three-bomb rack
#   Terrier    Facet     DoubleBarrel, which is Facet's whole character
#   Weasel     Cipher    the hull that arrives unseen
#   Lancaster  Lattice   bombs that come back off a wall
#   Shark      Spire     the hull a team is built around
#
# That file has seven ship sections and no [Shark], so Spire is the one hull
# here with nothing said about it and keeps the baseline throughout.

description = "two teams, six a side"

# [Flag] MaxFlags=0 with FlagMode=0, [Soccer] BallCount=0, [King] DeathCount=0.
# No flag game, no ball and no crown, which leaves kills.
mode = "arena"

# The zone's own map, converted from the `.lvl` that came with the settings
# file above by `sim/tools/lvl2vw`. Twelve pilots spread over a thousand tiles
# are twelve pilots who never meet, and this one puts its structure in reach of
# the starts the converter picked.
map = "alpha.vwmap"

# [Team] MaxPerTeam=6 across DesiredTeams=2.
max_players = 12
# Seats, which is those twelve plus the nine bots holding the room until they
# arrive.
max_ships = 24
# The room is full at its human cap, so that is when the next one opens.
fill_target = 12

# Six a side is the game, so the room is held at twenty of its twenty-four
# seats and the four spare are what an arriving pair drop into.
bot_fill = 0.8
# Rooms are how a twelve-player zone holds more than twelve people. Chaos and
# War keep one apiece because each is a single large room; four of these cost
# less than one of those.
max_rooms = 4

teams = 2
# [Team] ForceEvenTeams=0 says the original will not reshuffle a running game,
# and neither do we. It does still put an arriving pilot on the smaller side,
# which is what this key does. Writing "none" here is not the neutral choice it
# looks like: it puts everybody on side zero, and every hostility test in this
# stack asks whether two sides differ, so it would be combat off.
balance = "smaller"

[arena]
# [Misc] BounceFactor=22, against 16 for a wall that takes nothing. The
# original's number divides rather than multiplies, so a wall gives back 16/22
# of what hit it, which is 12 in the out-of-16 units this key uses. Read the
# other way it would be a wall returning 137%, which accelerates anything that
# clips it. The original has no separate term for speed along a wall, so both
# take the same number.
bounce = 12
friction = 12

# [Kill] EnterDelay=200, so two seconds dead.
respawn_delay = 200

# [Prize] PrizeDelay=300 with PrizeHideCount=10: ten greens every three
# seconds, which as one green at a time is one every thirty ticks.
prize_delay = 30
# [Prize] PrizeFactor=1300, which is greens per thousand players in the game.
# Twelve of them ask for sixteen. The room also carries bots, so the field is a
# little thinner per pilot here than that file meant it to be.
prize_max = 16
# [Prize] PrizeMinExist=4000 and PrizeMaxExist=8000. One number here rather
# than a range, so the middle of theirs.
prize_life = 6000
# [Prize] PrizeNegativeFactor=300, one green in three hundred, against the
# thousand this key counts in.
rust = 3
# Thirty greens in hand the moment a ship spawns. This one is criccomini's call
# rather than the file's, and it is worth saying why the file cannot decide it.
#
# Its ships start bare: InitialGuns=1, InitialBombs=0 and every charge at zero,
# which is what a fresh hull here already is. The one thing they do start with
# is InitialBounty=50, and bounty in this core is a sum over what a pilot holds
# rather than a number of its own, so there is no way to be worth fifty while
# carrying nothing. Greens are the only lever, and one green is one bounty:
# thirty of them measures 29.5 at spawn, fifty measures 49.4 and hands over
# every stat, ladder and add-on at once, which leaves nothing to fly for.
spawn_prizes = 30

# [Kill] BountyIncreaseForKill=6, twice what our own zones pay, so a streak in
# here is visible from further away.
bounty_per_kill = 6
# [Kill] KillPointsPerFlag=0, and there are no flags to hold anyway.
points_per_flag = 0

# [Door] DoorDelay=600. DoorMode=-1 is weighted random, which this core has no
# model of: ours is a clock, and the baseline's four seconds open of the six
# stands.
door_period = 600

# MultiFireAngle=500 in the ship sections, where 111 is a degree. That is 4.5,
# and this key counts whole ones.
mod_spread = 5

# MultiFireEnergy=30 against BulletFireEnergy=20, and MultiFireDelay=50 against
# BulletFireDelay=25: half again the energy, twice the wait.
multi_energy = 50
multi_delay = 100

# [Bomb] ProximityDistance=3 tiles, and a tile more for each level of the bomb
# carrying it.
prox_step = 16
# [Shrapnel] InactiveShrapDamage=3, over the first quarter second, which is
# what stops a bomb landing twice at point blank.
shrap_inactive = 3
shrap_inactive_ticks = 25

[arena.mod_step]
# One rung of multifire is two more barrels, one rung of bouncing is one more
# wall, and proximity is ProximityDistance in pixels.
multi = 2
bounce = 1
prox = 48

# [PrizeWeight], entry for entry, for everything in it this core has a prize
# for. The numbers are relative rather than percentages, and are read against
# the pool of whichever hull took the green.
#
# Energy at 90 and thrust at 80 are the heaviest entries here. A burst is the
# lightest at 10, against the 70 our baseline gives it, and both weapon levels
# are 60 where our own zones price a level at 25.
#
# Left alone: bomb-multi, gun-prox, gun-shrapnel and bomb-bounce, which that
# file has no entry for because those pairings do not exist there, and freeze
# and push, which are ours and have no entry to copy. Setting a weight to zero
# would take the prize out of the game, and that is not what an absent line
# means.
[arena.prize_weight]
energy = 90         # Energy
recharge = 70       # QuickCharge
speed = 70          # TopSpeed
thrust = 80         # Thruster
rotation = 50       # Rotation
gun-level = 60      # Gun
bomb-level = 60     # Bomb
gun-multi = 30      # MultiFire
gun-bounce = 40     # BouncingBullets
bomb-prox = 40      # Proximity
bomb-shrapnel = 60  # Shrapnel
charge-1 = 40       # Repel
charge-2 = 10       # Burst

# [Burst] BurstDamageLevel=515, which is the damage of one of the twenty-four
# rounds a burst throws. Our baseline uses the 700 that ships with the
# reference server, so a burst here is survivable at a range that one is not.
[[arena.weapons]]
name = "charge-2"
damage = 515

# [Ships] BulletFireDelay=30 on the Terrier alone, where every other ship in
# that file fires at 25. A ladder is a weapon per rung, so all three say it.
[[arena.weapons]]
name = "facet-gun"
delay = 30

[[arena.weapons]]
name = "facet-gun-2"
delay = 30

[[arena.weapons]]
name = "facet-gun-3"
delay = 30

# [Bomb] BombAliveTime=6000 against the 8000 the reference server ships. Sixty
# seconds at BombSpeed is 750 tiles, so on a map this size it is still "until
# it hits something", but it is what the file says.
#
# Cipher's two carry one line more. EmpBomb=1 on the Weasel, with [Bomb]
# EBombShutdownTime=400, stops a hit pilot recharging for four seconds.
# EBombDamagePercent=1000 is full damage, so nothing else about them moves.
[[arena.weapons]]
name = "apex-bomb"
life = 6000

[[arena.weapons]]
name = "apex-bomb-2"
life = 6000

[[arena.weapons]]
name = "wedge-bomb"
life = 6000

[[arena.weapons]]
name = "wedge-bomb-2"
life = 6000

[[arena.weapons]]
name = "chord-bomb"
life = 6000

[[arena.weapons]]
name = "chord-bomb-2"
life = 6000

[[arena.weapons]]
name = "anvil-bomb"
life = 6000

[[arena.weapons]]
name = "anvil-bomb-2"
life = 6000

[[arena.weapons]]
name = "anvil-bomb-3"
life = 6000

[[arena.weapons]]
name = "spire-bomb"
life = 6000

[[arena.weapons]]
name = "spire-bomb-2"
life = 6000

[[arena.weapons]]
name = "cipher-bomb"
life = 6000
stall = 400

[[arena.weapons]]
name = "cipher-bomb-2"
life = 6000
stall = 400

[[arena.weapons]]
name = "facet-bomb"
life = 6000

[[arena.weapons]]
name = "facet-bomb-2"
life = 6000

[[arena.weapons]]
name = "lattice-bomb"
life = 6000

[[arena.weapons]]
name = "lattice-bomb-2"
life = 6000

# The ships.
#
# Four of the seven sections in that file differ from the rest, and this is
# them. Everything not written here is identical across all seven, which is the
# original's own habit: its ships fly alike and are told apart by what they
# carry.

# [Warbird] MaximumRotation=300 against 230, InitialRotation=210 against 200,
# MaximumThrust=19 against 17 and InitialThrust=16 against 15. The interceptor
# turns harder and pushes harder than anything else in the zone, and pays for
# it with the same hull everyone has.
[[arena.ships]]
name = "Apex"
rotation = 300
initial_rotation = 210
upgrade_rotation = 40
thrust = 19
initial_thrust = 16
upgrade_thrust = 2
# ShrapnelMax=8, which is the rung a fragment count of eight sits on here.
bomb_mods = { prox = 1, shrapnel = 2 }

# [Javelin] MaximumSpeed=3750 against 3250 and InitialSpeed=2200 against 2010.
# It is the fastest thing in the zone from the moment it spawns.
[[arena.ships]]
name = "Wedge"
speed = 3750
initial_speed = 2200
upgrade_speed = 250
# ShrapnelMax=8 like everything else in that file, so the bombers lose the
# extra rung our baseline gives them off the Shark's 31.
bomb_mods = { prox = 1, shrapnel = 2 }

# [Spider] InitialRecharge=500 against 400. It starts a quarter better at
# getting energy back and climbs to the same ceiling as everyone.
[[arena.ships]]
name = "Chord"
initial_recharge = 500
bomb_mods = { prox = 1, shrapnel = 2 }

# [Leviathan] MaxBombs=3, which the baseline already gives Anvil. Its
# ShrapnelMax is 8 like the rest.
[[arena.ships]]
name = "Anvil"
bomb_mods = { prox = 1, shrapnel = 2 }

# [Weasel] ShrapnelMax=0. The one hull whose bombs never break up, which is
# most of what makes its EMP bomb above a different weapon rather than a
# better one.
[[arena.ships]]
name = "Cipher"
bomb_mods = { prox = 1 }

# [Lancaster] BombBounceCount=1, the only ship in that file with any. It is
# innate there and an add-on here, so this is the ceiling rather than what it
# spawns with. Push is ours, has no entry to copy, and stays where the baseline
# put it.
[[arena.ships]]
name = "Lattice"
bomb_mods = { prox = 1, shrapnel = 2, bounce = 1, push = 2 }

# What that file asks for and this core has nowhere to put. Listed rather than
# dropped, because the next person to read both files will otherwise spend an
# afternoon working out which of these were decisions.
#
# Weapons and gear we do not have: cloak, stealth, xradar, antiwarp, warp,
# decoys, thors, bricks, portals, rockets, mines and the shields, super and
# full-charge prizes, with their energy costs, counts and prize weights.
# Turrets, so TurretLimit, the two attach penalties and AttachBounty. Soccer
# and King, both switched off in that file anyway.
#
# InitialBounty=50, for the reason spelled out at spawn_prizes above: bounty is
# derived from holdings here, so a number of its own has nowhere to live.
#
# A hull that starts on a different rung: InitialGuns=2 on the Terrier, and
# InitialBombs=1 on the Leviathan and the Weasel against 0 on the other five.
# Everyone here starts on rung one of both triggers, so this zone is a little
# freer with bombs than that file is, and there is no key to narrow it.
#
# Bomb detail with no model: BombExplodeDelay, BombSafety and JitterTime.
# Gravity and GravityTopSpeed, with Wormhole:GravityBombs and SwitchTime, since
# a wormhole here is a map feature with its own two settings. This map has one,
# and since this file sets neither `wormhole_pull` nor `wormhole_range` it pulls
# at the baseline's strength.
#
# Prize detail with no model: MultiPrizeCount, PrizeHideCount as a batch rather
# than a rate, DeathPrizeTime, EngineShutdownTime, and MinimumVirtual with
# UpgradeVirtual, which place greens in a circle around the middle that widens
# with the population. Ours land in a ring around a live pilot instead, which
# is the same problem answered differently and the reason those two have
# nowhere to go.
#
# Scoring we do not keep: FlagReward, the Territory and Periodic reward tables,
# BannerPoints, DamageFactor, PrizeShareLimit and the whole [Cost] section,
# since nothing here is bought.
#
# And everything about a 1997 client and its network: Latency, PacketLoss,
# Security, Routing, Radar, SendPositionDelay, AllowSavedShips, SafetyLimit,
# FrequencyShift and TickerDelay. The Message section goes with them, since
# there is no chat in this game at all.
