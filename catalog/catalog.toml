# The reference deployment. docs/architecture/catalog.md is the schema.
#
# One artifact, versioned as a unit. Bump `version` on every publish: an arena
# server takes the highest version any directory offers, so this number is the
# whole of the conflict resolution and a rollback needs a new higher number
# rather than a reused one.

version = 1
name = "vectorwake"
description = "the reference deployment"

# What an arena server serves when nothing has told it otherwise.
default_zone = "chaos"

# Deployment-wide, because a ban that applies in Chaos and not in War is a
# support ticket waiting to happen.
bans = []

[[staff]]
name = "chris"
capabilities = ["ban", "catalog", "kick", "drain", "pin", "reload"]

# Pool credentials: whose capacity this is, named here so it cannot be claimed,
# with a cap on what one leaked token can do. Generate with
# `vectorwake-server token`, which prints the raw token once and the row to
# paste here. The digest is safe to commit; the raw token is not.
[[pool]]
name = "local pool"
token = "sha256:0c7cb30b51f8f56b0e5f6088289393ee3f0f9b342e0c95de6b7bbb7be7a56e4d"
region = "local"
max_instances = 8

# Declared rather than scanned, so retiring a zone is a reviewed line removed
# and a half-written directory does not become live.
[[zone]]
name = "chaos"

[[zone]]
name = "war"
